// Списки локаций и батарей для селектов: последняя строка — «+ Добавить…»,
// чтобы не уходить со страницы за новой записью.
const NEW_OPT = '__new';
// Один строитель списка АКБ на все селекты: freeOnly скрывает занятые
// (keepId — текущая остаётся), addNew добавляет «+ Добавить…».
function battOptions(o) {
  o = o || {};
  return [['', o.emptyLabel || '—']]
    .concat(S.batteries
      .filter((b) => b.status !== 'retired' && (!o.freeOnly || b.id === o.keepId || !battOwner(b.id)))
      .map((b) => [b.id, b.label + (b.weight && !o.noWeight ? ' · ' + b.weight + ' г' : '')]))
    .concat(o.addNew ? [[NEW_OPT, '+ Добавить аккумулятор…']] : []);
}
function siteOptions(list, o) {
  o = o || {};
  return [['', o.emptyLabel || '—']]
    .concat((list || S.sites).map((x) => [x.id, x.name]))
    .concat(o.pre || [])
    .concat([[NEW_OPT, '+ Добавить локацию…']]);
}

// saved — значения формы, если её прервали ради «+ Добавить…».
function openFinishForm(sessionId, saved) {
  const s = S.sessions.find((x) => x.id === sessionId);
  if (!s) return;
  const v = saved || (s.end ? s : {}); // завершённый полёт — правка итога
  const elapsed = Math.round(((s.end || s.landedAt || Date.now()) - s.start) / 60000);
  // Забытый полёт: не подставляем абсурдные «480 мин» — пусть пилот
  // впишет фактическую длительность сам.
  const forgotten = elapsed > STALE_FLIGHT_MIN;
  const mins = v.durationMin != null ? v.durationMin : forgotten ? '' : Math.max(1, elapsed);
  openModal('Итог полёта', `<form data-form="finish" data-id="${s.id}">
    <div class="grid2">
      ${field('Длительность, мин', `<input type="number" name="durationMin" min="0" value="${esc(mins)}" ${forgotten ? 'placeholder="сколько летали?"' : ''}>`,
        forgotten ? 'полёт выглядит забытым — впишите фактическое время' : '')}
      ${field('Результат', selectHtml('result', Object.entries(RESULTS), v.result || 'normal'))}
    </div>
    ${field('Аккумулятор', selectHtml('batteryId', battOptions({ addNew: true }),
      v.batteryId != null ? v.batteryId : s.batteryId, 'data-change="finish-batt"'),
      S.batteries.length ? 'Циклы выбранной АКБ вырастут на 1' : 'Парк батарей — во вкладке «Флот»')}
    ${field('Локация', selectHtml('siteId', siteOptions(),
      v.siteId != null ? v.siteId : s.siteId, 'data-change="finish-site"'))}
    ${field('Погода', `<input type="text" name="weather" value="${esc(v.weather || '')}" placeholder="напр. ветер 5 м/с, +18°, ясно">`)}
    ${field('Заметки', `<textarea name="notes" placeholder="как летела, что понравилось">${esc(v.notes || '')}</textarea>`)}
    ${field('Проблемы', `<textarea name="problems" placeholder="что сломалось или насторожило">${esc(v.problems || '')}</textarea>`)}
    <button class="btn btn-primary" type="submit">Записать полёт</button>
  </form>`);
}

// Открыть форму новой локации/АКБ, запомнив незаконченный «Итог полёта».
// Стэш — замыкание «как переоткрыть прерванную форму»: dismissModal и
// afterNested не знают, ЧТО за форма прервана, — новая прерываемая форма
// добавляется одним таким замыканием, без веток по kind.
function openFromFinish(form, which) {
  const sessionId = form.dataset.id;
  const values = Object.fromEntries(new FormData(form));
  UI.modalReturn = {
    field: which === 'site' ? 'siteId' : 'batteryId',
    reopen: (patch) => openFinishForm(sessionId, Object.assign({}, values, patch)),
  };
  if (which === 'site') openSiteForm(null); else openBattPicker();
}

// После сохранения локации/АКБ, открытой из другого места: подставить
// новую запись туда, откуда её вызвали. true — вернули форму сами.
async function afterNested(what, id) {
  const r = UI.modalReturn;
  if (r && r.reopen) {
    UI.modalReturn = null;
    r.reopen({ [r.field]: id });
    return true;
  }
  if (UI.view === 'prep' && UI.prep) {
    if (what === 'site') UI.prep.siteId = id;
    // «+ Добавить…» с чек-листа тоже ставит АКБ в борт (если её
    // не отдали другому борту прямо в форме через «Стоит в борте»)
    else if (!battOwner(id)) await installBattery(UI.prep.aircraftId, id);
  } else if (UI.view === 'model' && what === 'batt') {
    // «+ Добавить…» из карточки борта: новая АКБ ставится в этот борт
    if (!battOwner(id)) await installBattery(UI.arg, id);
  } else if (UI.view === 'weather' && what === 'site') {
    const s = S.sites.find((x) => x.id === id);
    if (s && s.lat != null) UI.wx.siteId = id;
  }
  return false;
}

// Имя копии: «Apex 5″» → «Apex 5″ (2)»; копия копии — «(3)», а не
// «Apex 5″ (2) (2)». Свободный номер ищется по всему флоту, сравнение
// без регистра и краевых пробелов — иначе вторая копия того же борта
// заводила бы второй «(2)».
function cloneName(name) {
  const base = String(name || 'Борт').replace(/\s*\(\d+\)\s*$/, '').trim() || 'Борт';
  const taken = new Set(S.aircraft.map((x) => String(x.name || '').trim().toLowerCase()));
  for (let n = 2; n <= 99; n++) {
    const cand = base + ' (' + n + ')';
    if (!taken.has(cand.toLowerCase())) return cand;
  }
  return base + ' (копия)';
}

// Комплектация нового борта — от образца или от готовой платформы.
// Копия ГЛУБОКАЯ: клон правит свои компоненты, образец цел. Берём только
// собственные ключи и только три строковых поля: запись из чужой копии
// произвольна, а ключи прототипа в этом проекте уже дважды протаскивали
// в разметку исходник функции. Нет комплектации — пустой словарь.
function copyComponents(srcObj) {
  const out = {};
  const c = srcObj && srcObj.components;
  if (!c || typeof c !== 'object') return out;
  for (const k of Object.keys(c)) {
    const v = c[k];
    if (v && typeof v === 'object') {
      out[k] = { name: String(v.name || ''), fw: String(v.fw || ''), notes: String(v.notes || '') };
    }
  }
  return out;
}

const FORMS = {
  model: async (form) => {
    const fd = new FormData(form);
    const id = form.dataset.id;
    const preset = RC.AIRCRAFT_PRESETS.find((p) => p.id === form.dataset.preset);
    // Копия борта: комплектация приходит от образца, а не от платформы.
    const src = form.dataset.clone ? S.aircraft.find((x) => x.id === form.dataset.clone) : null;
    const a = id ? S.aircraft.find((x) => x.id === id) : {
      id: uid(), statusManual: '', createdAt: Date.now(),
      components: copyComponents(src || preset),
    };
    a.name = fd.get('name').trim();
    a.type = fd.get('type');
    a.manufacturer = fd.get('manufacturer').trim();
    a.weight = +fd.get('weight') || null;
    a.wingspan = +fd.get('wingspan') || null;
    // Замок летящего борта проверяем ДО мутации: a — живой объект из
    // S.aircraft, и преждевременное присваивание ломало и проверку,
    // и «откат» (battOwner видел уже изменённое значение).
    let newBatt = fd.get('batteryId') || null;
    if (newBatt === NEW_OPT) newBatt = null; // страховка от застрявшего «__new»
    if (newBatt !== (a.batteryId || null)) {
      const lock = battLockedBy(a.id, newBatt);
      if (lock) {
        alert(`«${lock}» сейчас в полёте — аккумулятор останется прежним до посадки.`);
      } else {
        a.batteryId = newBatt;
        // releaseBattery пишет напрямую в RCDB; S.aircraft обновит общий put(a) ниже
        if (newBatt) await releaseBattery(newBatt, a.id);
      }
    }
    a.maxWind = +String(fd.get('maxWind')).replace(',', '.') || null;
    const maxAlt = +fd.get('maxAlt');
    a.maxAlt = maxAlt ? Math.min(WX_ALT_MAX, Math.max(10, maxAlt)) : null;
    const svcEvery = Math.round(+fd.get('svcEvery'));
    a.svcEvery = svcEvery > 0 ? Math.min(999, svcEvery) : null;
    const alarmMin = Math.round(+String(fd.get('alarmMin') || '').replace(',', '.') * 2) / 2;
    a.alarmMin = alarmMin > 0 ? Math.min(120, alarmMin) : null;
    const svcEveryMin = Math.round(+fd.get('svcEveryMin'));
    a.svcEveryMin = svcEveryMin > 0 ? Math.min(99999, svcEveryMin) : null;
    a.notes = fd.get('notes').trim();
    const photo = fd.get('photo');
    if (photo && photo.size) { a.photo = photo; dropPhotoURL(a.id); }
    await put('aircraft', a);
    // Конфигурации копии — своими записями: тот же файл и текст, новые
    // id и владелец. Полёты, работы и прогоны не копируются никогда.
    if (!id && src) {
      for (const c of S.configs.filter((x) => x.aircraftId === src.id)) {
        await put('configs', Object.assign({}, c, { id: uid(), aircraftId: a.id, createdAt: Date.now() }));
      }
    }
    closeModal();
    if (!id) UI.justCreated = a.id; // баннер «что дальше» на карточке
    go('#/model/' + a.id);
  },
  comp: async (form) => {
    const a = S.aircraft.find((x) => x.id === form.dataset.id);
    const fd = new FormData(form);
    const c = {
      name: fd.get('name').trim(),
      fw: (fd.get('fw') || '').trim(), // версия прошивки компонента (2.0)
      notes: fd.get('notes').trim(),
    };
    // components из копии проверяет только validateBackup (там лишь id):
    // строка на месте объекта роняла запись в strict mode.
    a.components = a.components && typeof a.components === 'object' ? a.components : {};
    // Пустая запись ключ не занимает: очищенный убранный слот («Передатчик»)
    // уходит со строки насовсем, а не остаётся объектом из пустых строк.
    if (c.name || c.fw || c.notes) a.components[form.dataset.key] = c;
    else delete a.components[form.dataset.key];
    await put('aircraft', a);
    closeModal();
    render();
  },
  maint: async (form) => {
    const fd = new FormData(form);
    const m = form.dataset.id
      ? S.maintenance.find((x) => x.id === form.dataset.id)
      : { id: uid(), aircraftId: form.dataset.aid, createdAt: Date.now() };
    m.title = fd.get('title').trim();
    m.kind = fd.get('kind');
    m.date = fd.get('date') || todayISO();
    m.reason = fd.get('reason').trim();
    m.next = fd.get('next').trim();
    // m — живой объект из S.maintenance: старое значение читаем ДО присваивания,
    // иначе «когда закрыли» затрётся при каждом сохранении записи.
    const wasDone = !!m.done;
    m.done = !!fd.get('done');
    if (m.done && !wasDone) m.doneAt = Date.now();
    if (!m.done) m.doneAt = null;
    const photo = fd.get('photo');
    if (photo && photo.size) { m.photo = photo; dropPhotoURL(m.id); }
    else if (fd.get('dropPhoto')) { m.photo = null; dropPhotoURL(m.id); }
    await put('maintenance', m);
    closeModal();
    render();
  },
  site: async (form) => {
    const fd = new FormData(form);
    const s = form.dataset.id ? S.sites.find((x) => x.id === form.dataset.id) : { id: uid(), createdAt: Date.now() };
    s.name = fd.get('name').trim();
    s.place = fd.get('place').trim();
    // Одно поле «широта, долгота» — как копируется из карт.
    const c = parseCoords(fd.get('coords'));
    s.lat = c ? +c.lat.toFixed(5) : null;
    s.lon = c ? +c.lon.toFixed(5) : null;
    s.notes = fd.get('notes').trim();
    s.isDefault = !!fd.get('isDefault');
    if (s.isDefault) {
      for (const other of S.sites.filter((x) => x.isDefault && x.id !== s.id)) {
        other.isDefault = false;
        await RCDB.put('sites', other);
      }
    }
    await put('sites', s);
    if (await afterNested('site', s.id)) return;
    closeModal();
    render();
  },
  group: async (form) => {
    const fd = new FormData(form);
    const name = String(fd.get('name') || '').trim();
    if (!name) return;
    const groups = S.settings.fleetGroups || (S.settings.fleetGroups = []);
    const g = form.dataset.id ? groups.find((x) => x.id === form.dataset.id) : { id: uid(), parentId: null };
    if (!g) return;
    g.name = name;
    if (fd.get('parentId') != null) g.parentId = fd.get('parentId') || null;
    if (!form.dataset.id) groups.push(g);
    await saveSettings();
    // «+ Новая группа…» из переноса борта: сразу переносим его сюда
    const aid = form.dataset.moveAid;
    if (aid) {
      const a = S.aircraft.find((x) => x.id === aid);
      if (a) { a.groupId = g.id; await put('aircraft', a); }
    }
    closeModal();
    render();
  },
  batt: async (form) => {
    const fd = new FormData(form);
    const b = form.dataset.id ? S.batteries.find((x) => x.id === form.dataset.id) : { id: uid(), createdAt: Date.now() };
    b.label = fd.get('label').trim();
    b.chem = fd.get('chem');
    b.cells = +fd.get('cells') || null;
    b.p = +fd.get('p') || null;
    b.capacity = +fd.get('capacity') || null;
    b.weight = +fd.get('weight') || battEstimateWeight(b.chem, b.cells, b.capacity) || null;
    b.cycles = +fd.get('cycles') || 0;
    b.status = fd.get('status');
    b.notes = fd.get('notes').trim();
    await put('batteries', b);
    // «Стоит в модели»: снять с прежней и поставить в выбранную.
    // Списанная АКБ в модели стоять не может — снимается принудительно
    // (иначе модель с ней числилась бы «собранной» в окнах погоды).
    const owner = (battOwner(b.id) || {}).id || '';
    const target = b.status === 'retired' ? ''
      : fd.get('inModel') != null ? String(fd.get('inModel')) : owner;
    if (target !== owner) {
      if (!target) await installBattery(owner, null);
      else await installBattery(target, b.id);
    }
    if (await afterNested('batt', b.id)) return;
    closeModal();
    render();
  },
  template: async (form) => {
    const fd = new FormData(form);
    const t = form.dataset.id ? S.templates.find((x) => x.id === form.dataset.id) : { id: uid() };
    t.name = fd.get('name').trim();
    t.type = fd.get('type');
    t.items = fd.get('items').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => ({ t: l }));
    await put('templates', t);
    closeModal();
    render();
  },
  config: async (form) => {
    const fd = new FormData(form);
    const file = fd.get('file');
    const c = {
      id: uid(), aircraftId: form.dataset.id,
      group: fd.get('group').trim(), label: fd.get('label').trim(),
      text: fd.get('text').trim(), date: todayISO(), createdAt: Date.now(),
      file: file && file.size ? file : null,
      fileName: file && file.size ? file.name : '',
    };
    if (!c.text && !c.file) { alert('Добавьте текст или файл.'); return; }
    await put('configs', c);
    closeModal();
    render();
  },
  finish: async (form) => {
    const fd = new FormData(form);
    const s = S.sessions.find((x) => x.id === form.dataset.id);
    if (!s) return;
    const firstFinish = !s.end; // ДО присваивания end, иначе всегда false
    s.end = s.end || s.landedAt || Date.now(); // правка итога не сдвигает конец
    s.landedAt = null;
    const elapsedMin = Math.round((s.end - s.start) / 60000);
    // Явный «0» — валидная длительность (прервали на взлёте); пустое
    // поле у забытого полёта — честное «неизвестно» (правится позже).
    const rawDur = String(fd.get('durationMin')).trim();
    s.durationMin = rawDur !== '' && isFinite(+rawDur)
      ? Math.max(0, Math.round(+rawDur))
      : (elapsedMin > STALE_FLIGHT_MIN ? null : elapsedMin);
    s.result = fd.get('result');
    s.batteryId = fd.get('batteryId');
    s.siteId = fd.get('siteId');
    s.weather = fd.get('weather').trim();
    s.notes = fd.get('notes').trim();
    s.problems = fd.get('problems').trim();
    await put('sessions', s);
    const b = S.batteries.find((x) => x.id === s.batteryId);
    if (b && firstFinish) {
      // Цикл = заряд→разряд: +1 только за ПЕРВЫЙ полёт после зарядки.
      // Короткий полёт и второй вылет на той же банке цикл не добавляют.
      // Правка уже записанного итога циклы не трогает.
      if (b.charge !== 'flown') b.cycles = (b.cycles || 0) + 1;
      b.charge = 'flown'; // разряжена полётом — подпись станет синей
      await put('batteries', b);
    }
    // Любой не-нормальный итог (краш, аварийная, проблема, обслуживание)
    // запускает одну и ту же цепочку: осмотр → «Выполнено» → «Готов».
    const trouble = firstFinish && s.result && s.result !== 'normal';
    const ta = S.aircraft.find((x) => x.id === s.aircraftId);
    if (trouble) {
      await put('maintenance', {
        id: uid(), aircraftId: s.aircraftId, date: todayISO(), kind: 'inspection',
        title: s.result === 'crash' ? 'Осмотр после краша' : 'Осмотр после полёта #' + s.flightNo,
        reason: s.problems || resultLabel(s), next: '', done: false, createdAt: Date.now(),
      });
      // борт с проблемой не может оставаться «подготовленным»
      if (ta && ta.prepared) { ta.prepared = null; await put('aircraft', ta); }
    }
    if (!trouble) {
      closeModal();
      go('#/model/' + s.aircraftId);
      return;
    }
    // Дорожная карта после проблемы — чтобы было очевидно, что дальше.
    // Переход по кнопке (go() закрыл бы это окно через onRoute).
    render();
    openModal('Что дальше', `<p>Борт переведён в <b>«Обслуживание»</b> — создан
      ${s.result === 'crash' ? 'осмотр после краша' : 'осмотр после полёта'}.</p>
      <p class="small muted" style="margin-top:8px">План простой:</p>
      <ol class="small" style="padding-left:18px;margin-top:4px">
        <li>Осмотрите «${esc(ta ? ta.name : '')}» и почините, что нужно.</li>
        <li>Откройте работу в карточке борта и отметьте «Выполнено».</li>
        <li>Статус сам вернётся в «Готов» — борт снова можно готовить к полёту.</li>
      </ol>
      <button class="btn btn-primary" data-nav="#/model/${s.aircraftId}" style="margin-top:12px">К карточке борта</button>
      <button class="btn" data-act="close-modal">Позже</button>`);
  },
  'pack-item': async (form) => {
    const p = S.packing.find((x) => x.id === UI.arg);
    const fd = new FormData(form);
    const t = String(fd.get('t')).trim();
    if (!p || !t) return;
    p.items.push({ t, done: false });
    await put('packing', p);
    render(true);
  },
  'pack-new': async (form) => {
    const fd = new FormData(form);
    const pack = { id: uid(), name: String(fd.get('name')).trim(), items: [] };
    await put('packing', pack);
    closeModal();
    go('#/pack/' + pack.id);
  },
  pilot: async (form) => {
    S.settings.pilot = String(new FormData(form).get('pilot')).trim();
    await saveSettings();
    render();
  },
  'cfg-compare': (form) => {
    const fd = new FormData(form);
    const a = S.configs.find((x) => x.id === fd.get('a'));
    const b = S.configs.find((x) => x.id === fd.get('b'));
    if (!a || !b) return;
    const d = lineDiff(a.text || '', b.text || '');
    const changed = d.lines.filter((l) => l[0] !== 'same').length;
    // Показываем изменения с контекстом в 2 строки.
    let html = '';
    if (!changed) {
      html = '<p class="muted">Версии совпадают.</p>';
    } else {
      const keep = new Set();
      d.lines.forEach((l, i) => {
        if (l[0] !== 'same') for (let k = i - 2; k <= i + 2; k++) keep.add(k);
      });
      let out = [];
      let skipping = false;
      d.lines.forEach((l, i) => {
        if (!keep.has(i)) {
          if (!skipping) { out.push('<div class="muted">···</div>'); skipping = true; }
          return;
        }
        skipping = false;
        const cls = l[0] === 'add' ? 'add' : l[0] === 'del' ? 'del' : '';
        const pre = l[0] === 'add' ? '+ ' : l[0] === 'del' ? '− ' : '  ';
        out.push(`<div class="${cls}">${pre}${esc(l[1])}</div>`);
      });
      html = (d.rough ? '<p class="small muted">Файлы большие — показаны только различающиеся строки.</p>' : '') +
        `<p class="small muted">Изменённых строк: ${changed}</p><div class="diff">${out.join('')}</div>`;
    }
    openModal('Что изменилось', html);
  },
};

// RC Planner · Мини-карта OSM и просмотр фото.

/* ---------- Мини-карта выбора точки (OSM, online) ----------
   Тайлы tile.openstreetmap.org, схема slippy z/x/y (Web Mercator).
   Математика проверена контрольными точками, живой тайл — curl 200
   image/png (2026-08-25). Атрибуция OSM обязательна — ссылка в блоке.
   Тап по карте вписывает координаты прямо в поле формы. */
const MAP_TILES = 'https://tile.openstreetmap.org';
const MAP_TILE = 256;
function mapLon2x(lon, z) { return (lon + 180) / 360 * Math.pow(2, z); }
function mapLat2y(lat, z) {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z);
}
function mapX2lon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
function mapY2lat(y, z) {
  const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

/* ---------- Просмотр фото во весь экран ----------
   Object URL берётся из общего кэша PHOTO_URLS и при закрытии НЕ
   отзывается: та же ссылка держит миниатюру на экране под окном, и
   отозванную кэш продолжал бы отдавать. Отзыв остаётся ровно там, где
   был, — dropPhotoURL при замене и удалении записи и полная чистка
   в wipe-all-yes и doImport. */
const PV = { scale: 1, x: 0, y: 0 };
const PV_STEPS = [1, 2, 3, 5];
const PV_MAX = 8;

function openPhotoView(store, id, caption) {
  const rec = (store === 'maintenance' ? S.maintenance : S.aircraft).find((x) => x.id === id);
  const u = rec && photoURL(rec);
  if (!u) return; // запись или фото успели убрать — молча ничего
  PV.scale = 1; PV.x = 0; PV.y = 0;
  // Заголовок уходит в <h2> БЕЗ esc() (openModal) — только литерал;
  // название борта живёт в подписи под фото и экранируется.
  openModal('Фото', `<div class="pv">
      <div class="pv-view"><img class="pv-img" src="${u}" alt="${esc(caption || '')}" draggable="false"></div>
      ${caption ? `<p class="small muted pv-cap">${esc(caption)}</p>` : ''}
      <div class="pv-bar">
        <button class="btn btn-sm" data-act="photo-zoom" data-d="-1" aria-label="Уменьшить">${ICONS.minus}</button>
        <span class="pv-scale" aria-live="polite">100%</span>
        <button class="btn btn-sm" data-act="photo-zoom" data-d="1" aria-label="Увеличить">${ICONS.plus}</button>
      </div>
    </div>`);
  const d = $('#modal-root dialog');
  d.classList.add('photo');
  wirePhotoView($('.pv-view', d));
}

// Применение состояния. Панорама ограничена рамкой: увести снимок за
// край и «потерять» его нельзя. На 1× смещение всегда обнуляется.
function pvApply() {
  const img = $('#modal-root .pv-img');
  if (!img) return;
  const view = img.parentElement;
  const mx = Math.max(0, (img.clientWidth * PV.scale - view.clientWidth) / 2);
  const my = Math.max(0, (img.clientHeight * PV.scale - view.clientHeight) / 2);
  PV.x = Math.min(mx, Math.max(-mx, PV.x));
  PV.y = Math.min(my, Math.max(-my, PV.y));
  img.style.transform = `translate(${PV.x}px, ${PV.y}px) scale(${PV.scale})`;
  const s = $('#modal-root .pv-scale');
  if (s) s.textContent = Math.round(PV.scale * 100) + '%';
}

// Ступень вверх или вниз от ЛЮБОГО текущего масштаба: после щипка на
// 4.3× «+» даёт 5, а не откатывает к 2.
function pvZoom(dir, cx, cy) {
  const next = dir > 0
    ? (PV_STEPS.find((s) => s > PV.scale + 0.01) || PV_MAX)
    : (PV_STEPS.slice().reverse().find((s) => s < PV.scale - 0.01) || 1);
  pvSetScale(next, cx, cy);
}

// Точка (cx, cy) — от ЦЕНТРА рамки; она остаётся под пальцем.
function pvSetScale(next, cx, cy) {
  const k = next / PV.scale;
  PV.x = (cx || 0) - k * ((cx || 0) - PV.x);
  PV.y = (cy || 0) - k * ((cy || 0) - PV.y);
  PV.scale = next;
  if (next <= 1) { PV.scale = 1; PV.x = 0; PV.y = 0; }
  pvApply();
}

// Панорама одним пальцем и щипок двумя — одной моделью: середина между
// касаниями остаётся под пальцами, k — во сколько раз развели пальцы
// (для одного пальца k = 1, получается чистый сдвиг). Координаты — от
// центра рамки; прямоугольник берётся на pointerdown и не пересчитывается.
// Схема та же, что у перетаскивания мини-карты (порог тапа 6 px).
function wirePhotoView(view) {
  if (!view) return;
  const pts = new Map();
  let st = null, lastTap = 0;
  const mid = (r) => {
    const a = [...pts.values()];
    const p = (q) => ({ x: q.x - r.left - r.width / 2, y: q.y - r.top - r.height / 2 });
    if (!a.length) return { x: 0, y: 0, d: 0 };
    if (a.length < 2) return Object.assign(p(a[0]), { d: 0 });
    const u = p(a[0]), v = p(a[1]);
    return { x: (u.x + v.x) / 2, y: (u.y + v.y) / 2, d: Math.hypot(u.x - v.x, u.y - v.y) };
  };
  const grab = (e) => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    // Синтетический pointerId (тесты) захвату не поддаётся — ронять
    // страницу из-за этого нельзя: набор ловит любую ошибку консоли.
    try { view.setPointerCapture(e.pointerId); } catch (err) {}
    const r = view.getBoundingClientRect();
    const m = mid(r);
    st = { r, x: m.x, y: m.y, d: m.d, px: PV.x, py: PV.y, s: PV.scale, moved: false };
  };
  view.addEventListener('pointerdown', grab);
  view.addEventListener('pointermove', (e) => {
    if (!st || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const m = mid(st.r);
    if (Math.abs(m.x - st.x) + Math.abs(m.y - st.y) > 6) st.moved = true;
    const pinch = pts.size > 1 && st.d > 10;
    const k = pinch ? Math.min(PV_MAX, Math.max(1, st.s * (m.d / st.d))) / st.s : 1;
    PV.scale = st.s * k;
    PV.x = m.x - k * (st.x - st.px);
    PV.y = m.y - k * (st.y - st.py);
    pvApply();
  });
  const end = (e) => {
    if (!st) return;
    const solo = pts.size === 1;
    const p = { x: st.x, y: st.y };
    pts.delete(e.pointerId);
    if (solo && !st.moved) {
      // Двойной тап: 1× ⇄ 2× вокруг точки касания.
      const now = Date.now();
      if (now - lastTap < 300) { pvSetScale(PV.scale > 1 ? 1 : 2, p.x, p.y); lastTap = 0; }
      else lastTap = now;
    }
    if (!pts.size) { st = null; return; }
    const r = view.getBoundingClientRect();
    const m = mid(r);
    st = { r, x: m.x, y: m.y, d: m.d, px: PV.x, py: PV.y, s: PV.scale, moved: true };
  };
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);
}

function openMapPicker(box, form) {
  const c = parseCoords(new FormData(form).get('coords'));
  // Меркатор не рисует |широту| > 85° — такие координаты валидны для
  // сохранения, но карту центрируем на Москве.
  const has = c && Math.abs(c.lat) <= 85;
  const st = {
    lat: has ? c.lat : 55.7558, lon: has ? c.lon : 37.6176, z: has ? 15 : 11,
    mLat: has ? c.lat : null, mLon: has ? c.lon : null,
  };
  box.innerHTML = `<div class="mp">
    <div class="mp-search">
      <input type="text" class="mp-q" placeholder="Найти место (город, деревня…)" enterkeyhint="search">
      <button type="button" class="mp-go">Найти</button>
    </div>
    <div class="mp-found small muted" hidden></div>
    <div class="mp-view"><div class="mp-layer"></div><div class="mp-pin" hidden>${ICONS.sites}</div>
      <div class="mp-zoom">
        <button type="button" class="mp-zi" aria-label="Ближе">+</button>
        <button type="button" class="mp-zo" aria-label="Дальше">−</button>
      </div></div>
    <div class="mp-bar">
      <span class="small muted mp-hint">Тап — поставить точку</span>
      <a class="small mp-ya" href="#" target="_blank" rel="noopener noreferrer">Я.Карты</a>
      <a class="small" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OSM</a>
    </div></div>`;
  const view = $('.mp-view', box);
  const layer = $('.mp-layer', box);
  const pin = $('.mp-pin', box);
  const ya = $('.mp-ya', box);

  // Кэш тайлов на время жизни карты: при панораме/зуме докладываются
  // только недостающие картинки, уже декодированные не пересоздаются
  // (без этого каждый жест мигал перерисовкой всей сетки).
  const tiles = new Map(); // 'z/x/y' → img
  function draw() {
    const w = view.clientWidth, h = view.clientHeight;
    const cx = mapLon2x(st.lon, st.z), cy = mapLat2y(st.lat, st.z);
    const max = Math.pow(2, st.z);
    layer.style.transform = '';
    const x0 = Math.floor(cx - w / 2 / MAP_TILE), x1 = Math.floor(cx + w / 2 / MAP_TILE);
    const y0 = Math.floor(cy - h / 2 / MAP_TILE), y1 = Math.floor(cy + h / 2 / MAP_TILE);
    const need = new Set();
    for (let x = x0; x <= x1; x++) {
      for (let y = Math.max(0, y0); y <= Math.min(max - 1, y1); y++) {
        const wx = ((x % max) + max) % max; // долгота заворачивается
        const key = st.z + '/' + wx + '/' + y + '@' + x;
        need.add(key);
        let img = tiles.get(key);
        if (!img) {
          img = document.createElement('img');
          img.src = MAP_TILES + '/' + st.z + '/' + wx + '/' + y + '.png';
          img.width = MAP_TILE; img.height = MAP_TILE;
          img.draggable = false; img.alt = '';
          img.style.position = 'absolute';
          tiles.set(key, img);
          layer.appendChild(img);
        }
        img.style.left = Math.round((x - cx) * MAP_TILE + w / 2) + 'px';
        img.style.top = Math.round((y - cy) * MAP_TILE + h / 2) + 'px';
      }
    }
    for (const [key, img] of tiles) {
      if (!need.has(key)) { img.remove(); tiles.delete(key); }
    }
    if (st.mLat != null) {
      pin.hidden = false;
      pin.style.left = ((mapLon2x(st.mLon, st.z) - cx) * MAP_TILE + w / 2) + 'px';
      pin.style.top = ((mapLat2y(st.mLat, st.z) - cy) * MAP_TILE + h / 2) + 'px';
    } else pin.hidden = true;
    // Открыть точку (или центр) в Яндекс.Картах: на телефоне ссылка
    // сама поднимает установленное приложение, на десктопе — сайт.
    const yLat = st.mLat != null ? st.mLat : st.lat;
    const yLon = st.mLon != null ? st.mLon : st.lon;
    ya.href = yaMapUrl(yLat.toFixed(5), yLon.toFixed(5), st.z);
  }

  // Поиск места — Nominatim (OSM), только по кнопке/Enter: политика
  // сервиса запрещает автодополнение и чаще 1 запроса в секунду.
  const qInput = $('.mp-q', box);
  const found = $('.mp-found', box);
  let searching = false;
  async function search() {
    const q = qInput.value.trim();
    if (!q || searching) return;
    searching = true;
    found.hidden = false;
    found.textContent = 'Ищу…';
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ru&q=' + encodeURIComponent(q));
      const list = await res.json();
      if (list.length) {
        st.lat = parseFloat(list[0].lat);
        st.lon = parseFloat(list[0].lon);
        st.z = Math.max(st.z, 12);
        found.textContent = list[0].display_name;
        draw();
      } else {
        found.textContent = 'Не нашлось — уточните запрос.';
      }
    } catch (e) {
      found.textContent = 'Поиск недоступен офлайн.';
    }
    searching = false;
  }
  $('.mp-go', box).addEventListener('click', search);
  qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search(); } });

  // Перетаскивание: слой едет transform'ом, центр фиксируется на отпускании.
  let drag = null;
  view.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.mp-zoom')) return; // кнопки зума — не перетаскивание
    drag = { x: e.clientX, y: e.clientY, moved: false };
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
    if (drag.moved) layer.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  });
  view.addEventListener('pointerup', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (drag.moved) {
      st.lon = mapX2lon(mapLon2x(st.lon, st.z) - dx / MAP_TILE, st.z);
      st.lat = mapY2lat(mapLat2y(st.lat, st.z) - dy / MAP_TILE, st.z);
      draw();
    } else {
      // тап: точка под пальцем — в поле координат
      const r = view.getBoundingClientRect();
      const lon = mapX2lon(mapLon2x(st.lon, st.z) + (e.clientX - r.left - r.width / 2) / MAP_TILE, st.z);
      const lat = mapY2lat(mapLat2y(st.lat, st.z) + (e.clientY - r.top - r.height / 2) / MAP_TILE, st.z);
      st.mLat = lat; st.mLon = lon;
      const input = form.querySelector('input[name="coords"]');
      if (input) input.value = lat.toFixed(5) + ', ' + lon.toFixed(5);
      draw();
    }
    drag = null;
  });
  view.addEventListener('pointercancel', () => { drag = null; layer.style.transform = ''; });
  $('.mp-zi', box).addEventListener('click', () => { if (st.z < 18) { st.z++; draw(); } });
  $('.mp-zo', box).addEventListener('click', () => { if (st.z > 3) { st.z--; draw(); } });
  draw();
}

// RC Planner · Экспорт и импорт резервной копии.

/* ============================================================
   Экспорт / импорт
============================================================ */

async function exportData(data, filename, scope) {
  const out = { format: 'rcplanner', version: 1, scope, exported: new Date().toISOString(), data: {} };
  for (const store of Object.keys(data)) {
    out.data[store] = [];
    for (const rec of data[store]) {
      const copy = Object.assign({}, rec);
      for (const key of ['photo', 'file']) {
        if (copy[key] instanceof Blob) {
          copy[key] = { __blob: await blobToDataURL(copy[key]), type: copy[key].type };
        }
      }
      out.data[store].push(copy);
    }
  }
  return saveFile(filename, new Blob([JSON.stringify(out)], { type: 'application/json' }));
}

function validateBackup(obj) {
  if (!obj || typeof obj !== 'object') return 'Файл не похож на резервную копию RC Planner.';
  if (obj.format !== 'rcplanner') return 'Это не файл RC Planner (нет отметки формата).';
  if (obj.version !== 1) return 'Файл создан другой версией приложения (' + obj.version + ').';
  if (!obj.data || typeof obj.data !== 'object') return 'В файле нет данных.';
  for (const store of Object.keys(obj.data)) {
    if (!RCDB.stores.includes(store)) return 'Неизвестный раздел данных: ' + store;
    if (!Array.isArray(obj.data[store])) return 'Повреждён раздел: ' + store;
    for (const rec of obj.data[store]) {
      if (!rec || typeof rec.id !== 'string') return 'Запись без id в разделе ' + store;
      // id уходят в data-атрибуты разметки — только безопасные символы
      if (!/^[\w.-]{1,64}$/.test(rec.id)) return 'Повреждённый id записи в разделе ' + store;
    }
  }
  return null;
}

function reviveBlobs(data) {
  for (const store of Object.keys(data)) {
    for (const rec of data[store]) {
      for (const key of ['photo', 'file']) {
        if (rec[key] && rec[key].__blob) {
          try { rec[key] = dataURLtoBlob(rec[key].__blob); }
          catch (e) { rec[key] = null; }
        }
      }
    }
  }
}

async function doImport(mode) {
  const parsed = UI.importData;
  if (!parsed) return;
  reviveBlobs(parsed.data);
  await RCDB.restore(parsed.data, mode);
  PHOTO_URLS.forEach((u) => URL.revokeObjectURL(u));
  PHOTO_URLS.clear();
  await loadAll();
  // Закрепляем нормализованные записи в самой базе: сырые строки из
  // копии не должны жить в IndexedDB и всплывать при любой перечитке.
  for (const store of Object.keys(NORM)) {
    if (Array.isArray(parsed.data[store]) && S[store].length) await RCDB.putAll(store, S[store]);
  }
  UI.importData = null;
  closeModal();
  openModal('Готово', '<p>Данные восстановлены.</p><div class="spacer"></div><button class="btn btn-primary" data-act="close-modal">Ок</button>');
  render();
}

function handleImportFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let parsed = null;
    let err = null;
    try { parsed = JSON.parse(r.result); } catch (e) { err = 'Файл не читается как JSON.'; }
    if (!err) err = validateBackup(parsed);
    if (err) {
      openModal('Импорт не удался', `<p>${esc(err)}</p><div class="spacer"></div>
        <button class="btn" data-act="close-modal">Понятно</button>`);
      return;
    }
    UI.importData = parsed;
    const n = Object.values(parsed.data).reduce((s, arr) => s + arr.length, 0);
    openModal('Импорт данных', `<p>В файле ${n} ${plural(n, 'запись', 'записи', 'записей')}
      (${parsed.scope === 'aircraft' ? 'экспорт одного борта' : 'полная копия'} от ${esc((parsed.exported || '').slice(0, 10))}).</p>
      <div class="spacer"></div>
      ${parsed.scope === 'aircraft'
        ? '<button class="btn btn-primary" data-act="import-merge">Добавить к моим данным</button>'
        : `<button class="btn btn-primary" data-act="import-merge">Объединить с моими данными</button>
           <button class="btn btn-danger" data-act="import-replace">Заменить всё содержимым файла</button>`}
      <button class="btn" data-act="close-modal">Отмена</button>`);
  };
  r.readAsText(f);
  input.value = '';
}

// RC Planner · Навигация и отрисовка.

/* ============================================================
   9. НАВИГАЦИЯ И ОТРИСОВКА
============================================================ */

const RENDERERS = {
  today: viewToday, fleet: viewFleet, model: viewModel,
  flight: viewFlight, prep: viewPrep, session: viewSession,
  journal: viewJournal,
  packing: viewPacking, pack: viewPack, weather: viewWeather,
  more: viewMore, tools: viewTools, sites: viewSites,
  batteries: viewBatteries, templates: viewTemplates,
  backup: viewBackup, privacy: viewPrivacy, help: viewHelp,
};

// Старые адреса (закладки, ссылки в changelog): #/log и #/stats
// открывают «Журнал» на нужном сегменте. Псевдоним разрешается ОДИН раз
// при разборе маршрута в onRoute, а не в рендерере: рендерер зовётся при
// каждой перерисовке, и сегмент «Полёты · Статистика» на таком адресе
// был мёртв — render(true) возвращал его назад (финальное ревью 2.0).
const ROUTE_ALIAS = {
  log: { view: 'journal', journalTab: 'log' },
  stats: { view: 'journal', journalTab: 'stats' },
};

// Тап по текущему адресу — перерисовать и прокрутить к началу. Сравниваем
// нормализованный адрес: при старте hash пустой, а onRoute уже считает
// его '#/today' — иначе первый тап по «Сегодня» глотался дедупликацией.
// Направление перехода задаёт navDirection() в onRoute, здесь его не ставим.
function go(hash) {
  if ((location.hash || '#/today') === hash) onRoute(true);
  else location.hash = hash;
}

// Корневой экран вкладки (#/today, #/fleet…): переход между ними — «tab».
function isTabRoot(view) {
  return TABS.some((t) => t.id === view);
}

// Направление перехода для View Transitions. Короткий стек маршрутов
// отличает «назад» (новый маршрут — предыдущий в стеке) от «вперёд»;
// history.back() и запасной маршрут кнопки «Назад» — тоже back.
// Переход между корневыми экранами вкладок — всегда «tab» (только
// прозрачность), даже если это возврат на предыдущую вкладку: панель
// не должна ездить то сбоку, то растворяться. Стек при этом правится
// как обычно — возврат снимает вершину.
function navDirection(hash, prevView, view) {
  const st = UI.navStack;
  const isPrev = st.length > 1 && st[st.length - 2] === hash;
  const tabHop = isTabRoot(prevView) && isTabRoot(view);
  const back = UI.navBackHint || (isPrev && !tabHop);
  UI.navBackHint = false;
  if (isPrev) st.pop();
  else if (st[st.length - 1] !== hash) st.push(hash);
  if (st.length > 40) st.shift();
  if (back) return 'back';
  return tabHop ? 'tab' : 'forward';
}

// force — перерисовать даже тот же маршрут (go на текущий адрес). Без
// него повтор того же адреса пропускается: на смену hash браузер шлёт
// и popstate, и hashchange — второй вызов ломал направление перехода
// и дважды собирал экран.
function onRoute(force) {
  const hash = location.hash || '#/today';
  if (!force && hash === UI.routeHash) return;
  UI.routeHash = hash;
  const parts = hash.replace(/^#\/?/, '').split('/');
  let view = parts[0] || 'today';
  const alias = ROUTE_ALIAS[view];
  if (alias) { UI.journalTab = alias.journalTab; view = alias.view; }
  const prevView = UI.view;
  UI.view = RENDERERS[view] ? view : 'today';
  UI.arg = parts[1] ? decodeURIComponent(parts[1]) : null;
  UI.navCount++;
  UI.navDir = navDirection(hash, prevView, UI.view);
  UI.modalReturn = null; // ушли со страницы — восстанавливать нечего
  if (UI.view !== 'model' || UI.arg !== UI.justCreated) UI.justCreated = null;
  closeModal(true);
  render(false, true);
}

// Точка у иконки «Полёт» — идёт незавершённый полёт (в воздухе или сел
// без итога): видно с любой вкладки.
function renderTabbar() {
  const active = TAB_OF[UI.view] || 'today';
  const live = activeSessions().length > 0;
  $('#tabbar').innerHTML = TABS.map((t) =>
    `<button class="tab" data-nav="#/${t.id}" ${t.id === active ? 'aria-current="page"' : ''}${t.id === 'flight' && live ? ' aria-label="Полёт — идёт полёт"' : ''}>
      ${t.id === active ? '<i class="tab-ind" aria-hidden="true"></i>' : ''}${ICONS[t.id]}${t.id === 'flight' && live ? '<i class="live" aria-hidden="true"></i>' : ''}<span>${t.label}</span></button>`).join('');
}

// render — обёртка над paint(): при поддержке View Transitions и без
// prefers-reduced-motion смена разметки идёт внутри
// document.startViewTransition, направление — html[data-vt]
// (forward|back|tab, для render(true) — update: корень не моргает,
// анимируются только элементы с view-transition-name). Разметка
// обновляется асинхронно (в колбэке) — код после render() на новый DOM
// рассчитывать не должен. toTop — прокрутить к началу (новый маршрут).
function render(keepScroll, toTop) {
  if (!document.startViewTransition || reducedMotion() || document.hidden) {
    paint(keepScroll, toTop);
    return;
  }
  document.documentElement.dataset.vt = keepScroll ? 'update' : UI.navDir;
  const vt = document.startViewTransition(() => paint(keepScroll, toTop));
  // Второй render() до конца первого перехода — переход пропускается,
  // а ready отклоняется; это штатно, но без catch — ошибка в консоли.
  vt.ready.catch(() => {});
}

function paint(keepScroll, toTop) {
  const y = window.scrollY;
  const focused = document.activeElement;
  // Кнопка меню клетки (ck-set) исчезает вместе с меню — фокус возвращаем
  // на клетку той же строки (ck-menu), иначе с клавиатуры он уйдёт на body.
  // Ключ элемента — data-i (клетки, строки), data-h (сегменты полоски
  // «Окон»), data-day (чипы дней): без него активный элемент после
  // Enter уходил на body (ревью пакета 5).
  const fAct = focused && focused.dataset && focused.dataset.act;
  const focusAct = fAct === 'ck-set' ? 'ck-menu' : fAct === 'wx-alt-set' ? 'wx-alt-menu' : fAct;
  const focusKey = focusAct && ['i', 'h', 'day', 'alt'].find((k) => focused.dataset[k] != null);
  const focusSel = focusKey
    ? `[data-act="${focusAct}"][data-${focusKey}="${focused.dataset[focusKey]}"]` : null;

  if (TIMER) { clearInterval(TIMER); TIMER = null; }
  const views = $('#views');
  views.innerHTML = (RENDERERS[UI.view] || viewToday)();
  // «Сегодня» — две колонки от 900 px (основная + aside); на телефоне
  // класс тот же, колонки складывает CSS.
  views.classList.toggle('two-col', UI.view === 'today');
  renderTabbar();
  applyNext(); // подсветка следующего шага — на готовой разметке

  if (keepScroll) {
    window.scrollTo(0, y);
    if (focusSel) { const el = $(focusSel); if (el) el.focus(); }
  } else if (toTop) {
    window.scrollTo(0, 0);
    // «Инструкция» по адресу #/help/<id> (кнопка «?» экрана): открытый
    // раздел — в начало окна. id проверяется по списку разделов.
    if (UI.view === 'help' && helpSectionId(UI.arg)) {
      const sec = $('#help-' + UI.arg);
      if (sec) sec.scrollIntoView({ block: 'start' });
    }
  }

  // Живой таймер: #timer с data-sid есть на экране полёта и в карточке
  // полёта на «Сегодня» — интервал один на любой экран.
  const tm = $('#timer[data-sid]');
  const s = tm && S.sessions.find((x) => x.id === tm.dataset.sid);
  if (s && !s.end && !s.landedAt) {
    TIMER = setInterval(() => {
      const t = $('#timer');
      const cur = S.sessions.find((x) => x.id === s.id);
      if (t && cur && !cur.end && !cur.landedAt) {
        const ms = Date.now() - cur.start;
        t.innerHTML = clockHtml(ms);
        // кольцо экрана полёта: заполнение относительно цели (сигнал
        // таймера или обычная длительность); цель пройдена — .over
        const ring = $('#ring-fill');
        if (ring) {
          const target = +ring.dataset.target || 0;
          ring.setAttribute('stroke-dashoffset', ringOffset(ms, target));
          const over = target > 0 && ms >= target;
          const box = $('#ring');
          if (box && box.classList.contains('over') !== over) {
            box.classList.toggle('over', over);
            const pill = $('#air-pill');
            if (pill) { pill.classList.toggle('alarm', over); pill.textContent = over ? 'Время вышло' : 'В воздухе'; }
          }
        }
      } else { clearInterval(TIMER); TIMER = null; }
    }, 1000);
  }
  syncAlarms();
  // Экран не гаснет только на экране полёта в воздухе; в остальных
  // случаях (посадка, отмена, уход с экрана) замок отпускается здесь.
  syncWakeLock();
}

/* == src/31-events.js == */
// RC Planner · Делегированные события документа.

/* ============================================================
   10. СОБЫТИЯ
   Разметка пересобирается целиком, поэтому все обработчики
   висят на document, элементы помечены data-атрибутами.
============================================================ */

document.addEventListener('click', (e) => {
  // Чип «Обслуживание» — ссылка к работам борта (лежит внутри кнопки
  // строки, поэтому перехватываем до data-nav/data-act).
  const cl = e.target.closest('.chip-link');
  if (cl) {
    e.preventDefault();
    const open = S.maintenance.filter((m) => m.aircraftId === cl.dataset.aid && !m.done);
    if (open.length === 1) openMaintForm(open[0]);
    else go('#/model/' + cl.dataset.aid);
    return;
  }
  // Я.Карты из формы локации: перед переходом подставить в href свежие
  // координаты из поля. Обычная ссылка target=_blank — iOS корректно
  // возвращает в приложение (в отличие от window.open).
  const yaLink = e.target.closest('.site-ya-link');
  if (yaLink) {
    const form = yaLink.closest('form');
    const c = form && parseCoords(new FormData(form).get('coords'));
    yaLink.href = c ? yaMapUrl(c.lat, c.lon)
      : 'https://yandex.ru/maps/'; // поле очищено — не вести на старую точку
    return; // не preventDefault: пусть ссылка работает как в списке локаций
  }
  // Меню действий (popover="manual"): тап мимо закрывает его; тап по
  // кнопке «⋯» ведёт в toggleMenu, тап по пункту — ниже, через data-act.
  const inMenu = e.target.closest('.menu');
  if (!inMenu && !e.target.closest('[aria-haspopup="menu"]')) closeMenus();
  // Снимок в строке лежит ВНУТРИ кнопки строки (data-nav ведёт в карточку
  // борта, data-act — в форму работы): перехватываем до неё, иначе тап по
  // фото уводил бы с экрана. Кнопкой снимок там сделать нельзя — вложенных
  // кнопок в HTML нет; крупное превью в героях кнопкой быть может, у него
  // data-photo висит на самой кнопке, и путь тот же.
  const ph = e.target.closest('[data-photo]');
  if (ph) {
    e.preventDefault();
    openPhotoView(ph.dataset.photo, ph.dataset.id, ph.dataset.cap || '');
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const act = e.target.closest('[data-act]');
  if (act && ACTIONS[act.dataset.act]) {
    e.preventDefault();
    if (inMenu) closeMenus(); // пункт выбран — меню закрывается до действия
    ACTIONS[act.dataset.act](act);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMenus();
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = FORMS[form.dataset.form];
  if (fn) fn(form);
});

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const kind = el.dataset.change;
  // «+ Добавить…» обрабатывается ОДНИМ гардом для всех селектов:
  // вернуть прежний выбор и открыть нужную форму. Ветки ниже про
  // NEW_OPT знать не обязаны.
  if (el.value === NEW_OPT) {
    if (kind === 'form-model-batt') {
      // прервали форму борта ради новой АКБ: значения (кроме фото)
      // вернутся, новая АКБ подставится в поле
      const form = el.closest('form');
      const orig = form.dataset.id ? S.aircraft.find((x) => x.id === form.dataset.id) : null;
      const preset = form.dataset.preset || null;
      const clone = form.dataset.clone || null; // копия борта: образец не терять
      const values = Object.fromEntries(new FormData(form));
      delete values.photo;
      // отмена диалога АКБ возвращает ПОСЛЕДНИЙ выбор в форме
      // (data-prev), а не сохранённое значение и не «__new»
      values.batteryId = el.dataset.prev || (orig && orig.batteryId) || '';
      UI.modalReturn = {
        field: 'batteryId',
        reopen: (patch) => openModelForm(orig, preset, Object.assign({}, values, patch), clone),
      };
      openBattPicker();
      return;
    }
    if (kind === 'finish-site' || kind === 'finish-batt') {
      const form = el.closest('form');
      if (form) openFromFinish(form, kind === 'finish-site' ? 'site' : 'batt');
      return;
    }
    el.value = kind === 'prep-site' ? (UI.prep && UI.prep.siteId) || ''
      : kind === 'prep-batt' ? (armedBattery(S.aircraft.find((x) => x.id === (UI.prep || {}).aircraftId)) || {}).id || ''
      : kind === 'model-batt' ? ((S.aircraft.find((x) => x.id === el.dataset.id) || {}).batteryId || '')
      : kind === 'weather-site' ? UI.wx.siteId || '' : '';
    (kind.endsWith('site') ? openSiteForm : openBattPicker)(null);
    return;
  }
  if (kind === 'form-model-batt') {
    el.dataset.prev = el.value; // на случай «+ Добавить…» с отменой
  } else if (kind === 'status-manual') {
    const a = S.aircraft.find((x) => x.id === el.dataset.id);
    if (a) { a.statusManual = el.value; put('aircraft', a).then(() => render(true)); }
  } else if (kind === 'model-batt') {
    installBattery(el.dataset.id, el.value).then(() => render(true));
  } else if (kind === 'prep-template') {
    if (!UI.prep) return;
    const a = S.aircraft.find((x) => x.id === UI.prep.aircraftId);
    const tpl = templatesFor(a.type).find((t) => t.id === el.value);
    if (tpl) {
      UI.prep.tplId = tpl.id;
      UI.prep.items = tpl.items.map((i) => ({ t: i.t, hint: i.hint || '', state: null }));
      UI.prep.menuIdx = null;
      UI.prep.lastIdx = null;
      render();
    }
  } else if (kind === 'prep-site') {
    if (!UI.prep) return;
    UI.prep.siteId = el.value;
  } else if (kind === 'prep-batt') {
    if (!UI.prep) return;
    const cur = (armedBattery(S.aircraft.find((x) => x.id === UI.prep.aircraftId)) || {}).id || '';
    if (el.value === '' && cur) {
      // снятие тоже «дублируется везде», но не молча: случайный тап
      // перед вылетом не должен незаметно разоружить модель
      el.value = cur;
      confirmModal('Снять аккумулятор с борта? Он уйдёт из «К вылету».', 'prep-batt-clear', '', 'Снять');
    } else {
      // выбор на чек-листе = установка в модель (дублируется везде)
      installBattery(UI.prep.aircraftId, el.value).then(() => render(true));
    }
  } else if (kind === 'fleet-sort') {
    S.settings.fleetSort = el.value;
    saveSettings().then(() => render(true));
  } else if (kind === 'batt-sort') {
    S.settings.battSort = el.value;
    saveSettings().then(() => render(true));
  } else if (kind === 'import-file') {
    handleImportFile(el);
  } else if (kind === 'weather-site') {
    UI.wx.siteId = el.value;
  } else if (kind === 'weather-model') {
    UI.wx.aircraftId = el.value;
    // АКБ, привязанная к модели, подставляется сама (можно переопределить)
    const wa = S.aircraft.find((x) => x.id === el.value);
    UI.wx.batteryId = (armedBattery(wa) || {}).id || '';
    UI.wx.alt = null; // высота — тоже переопределение экрана, у нового борта своя
    render(true);
  } else if (kind === 'weather-batt') {
    UI.wx.batteryId = el.value;
    render(true);
  } else if (kind === 'journal-aircraft') {
    UI.journalAircraft = el.value;
    render(true);
  }
});

// Нативная вставка в поле координат (долгое нажатие → «Вставить»
// на телефоне, Ctrl/Cmd+V): вычленяем пару чисел из любого текста —
// работает даже там, где кнопка чтения буфера упирается в систему.
document.addEventListener('paste', (e) => {
  const inp = e.target && e.target.closest && e.target.closest('input[name="coords"]');
  if (!inp || !e.clipboardData) return;
  const c = parseCoords(e.clipboardData.getData('text'));
  if (c) {
    e.preventDefault();
    inp.value = c.lat + ', ' + c.lon;
  }
});

window.addEventListener('hashchange', () => onRoute());
window.addEventListener('popstate', () => onRoute());
// Замок экрана браузер снимает, когда вкладка уходит в фон; по
// возвращении на экран полёта запрашиваем его заново.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) syncWakeLock();
});

// RC Planner · PWA: service worker, «Что нового».

/* ============================================================
   11. PWA И ОБНОВЛЕНИЯ
============================================================ */

function setupSW() {
  if (!('serviceWorker' in navigator)) return;
  if (!/^https?:$/.test(location.protocol)) return; // file:// — офлайн-файл без PWA
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
    SWREG = reg;
    if (reg.waiting && navigator.serviceWorker.controller) { UI.updateReady = true; render(); }
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          UI.updateReady = true;
          render();
        }
      });
    });
  }).catch(() => {});
  // При первой установке controllerchange тоже приходит — не перезагружаем.
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (had) location.reload();
    had = true;
  });
}

function showWhatsNew(manual) {
  const log = RC.CHANGELOG;
  if (!log.length) return;
  const latest = log[0];
  const entry = (c) => `<div style="margin-bottom:14px">
    <div style="display:flex;gap:8px;align-items:baseline">
      <strong>Версия ${esc(c.v)}</strong><span class="small muted">${fmtDate(c.date)}</span></div>
    <div class="small muted" style="margin-bottom:4px">${esc(c.title)}</div>
    <ul style="padding-left:18px">${c.items.map((i) => `<li class="small">${esc(i)}</li>`).join('')}</ul></div>`;
  let h = entry(latest);
  const past = log.slice(1, 6);
  if (past.length) {
    h += `<details class="fold"><summary>Что было раньше</summary><div class="fold-body">${past.map(entry).join('')}</div></details>`;
  }
  h += '<button class="btn btn-primary" data-act="close-modal">Понятно</button>';
  openModal('Что нового', h);
  if (!manual) lsSet('rcp.seen', String(latest.v));
}

// Версии — строки; никакой арифметики: ищем просмотренную по положению
// в списке. Не нашли (старый формат, копия из будущего) — показываем раз.
function maybeWhatsNew() {
  const latest = RC.CHANGELOG[0];
  if (!latest) return;
  const seen = lsGet('rcp.seen') || '';
  if (!seen) { lsSet('rcp.seen', String(latest.v)); return; } // первый запуск — без окна
  const i = RC.CHANGELOG.findIndex((c) => String(c.v) === seen);
  if (i !== 0) { showWhatsNew(false); lsSet('rcp.seen', String(latest.v)); }
}

/* == src/33-start.js == */
// RC Planner · Старт приложения.

/* ============================================================
   12. СТАРТ
============================================================ */

(async function start() {
  try {
    await loadAll();
    await seedIfNeeded();
    await migrateIfNeeded();
  } catch (e) {
    $('#views').innerHTML = `<div class="empty"><p>Не удалось открыть локальную базу данных.<br>
      <span class="small muted">${esc(e && e.message)}</span></p>
      <p class="small muted">Проверьте, что браузер не в приватном режиме.</p></div>`;
    return;
  }
  applyTheme();
  // Тема «как в системе» следует за системой на лету; явный выбор — нет.
  if (window.matchMedia) {
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (themePref() === 'system') applyTheme();
    });
  }
  onRoute();
  setupSW();
  // Первый запуск (нет rcp.hi) — приветствие в три шага; «Что нового»
  // в этот запуск не лезет: rcp.seen не трогаем, окно придёт в следующий
  // (на самом первом запуске maybeWhatsNew и так ничего не показывает).
  if (!lsGet('rcp.hi')) openWelcome(0); else maybeWhatsNew();
})();
