  <!-- Внешним хостам (тайлы, погода, геокодер) уходит только домен
       приложения, не путь страницы. -->
  <meta name="referrer" content="origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'sha256-vqnPs6mVUuJsPU8oIB19894sarGb68O7REzxRA7CSqk=' 'sha256-1xFvSbWKLC5GyFfZK78IrkeOQ2VdbSZRgKlvcf7b2vA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://api.open-meteo.com https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src https://embed.windy.com">
  <meta name="theme-color" content="#0b1017">

  <meta name="description" content="RC Planner — локальный офлайн-помощник авиамоделиста и FPV-пилота. Данные хранятся на вашем устройстве.">
  <title>RC Planner</title>
  <script>
    // Тема и режим интерфейса до первой отрисовки, чтобы не мигало.
    // Тот же расчёт живёт в src/02-utils.js как applyTheme()/uiMode():
    // без сохранённого выбора тема берётся у системы, режим — «Стандарт».
    // rcp.gloves='1' — старый ключ режима «В перчатках» (до 3.0).
    try {
      var d = document.documentElement, t = localStorage.getItem('rcp.theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.dataset.theme = t;
      var u = localStorage.getItem('rcp.ui');
      if (!u && localStorage.getItem('rcp.gloves') === '1') u = 'gloves';
      d.dataset.ui = u === 'gloves' || u === 'max' ? u : 'standard';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.dataset.ui = 'standard';
    }
  </script>
  
  <style>
/* == styles/00-tokens.css == */
/* RC Planner 3.0 · «Кокпит». Дизайн-система: слои, токены, темы, режимы.

   Слои (@layer) задают приоритет раз и навсегда, без гонки
   специфичности: поздний слой сильнее раннего. !important работает
   наоборот — в первом слое он сильнее всего, поэтому «без движения»
   (prefers-reduced-motion) живёт в reset.

   Три режима интерфейса — html[data-ui]:
     gloves   — «В перчатках»: крупно, контрастно, без эффектов и лишнего;
     standard — по умолчанию: чисто, мягкое свечение следующего шага;
     max      — «Максимум»: стекло, аврора, неон, живые рамки.
   Тема — html[data-theme] (dark | light), выбор хранит localStorage. */

@layer reset, tokens, base, layout, components, screens, effects, modes, art, print;

/* Угол бегущей рамки и доля заполнения шкал — типизированные свойства:
   только так их можно анимировать (у обычной custom property нет типа,
   браузер переключает её скачком). */
@property --glow-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --aurora-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

@layer tokens {
  :root {
    color-scheme: dark;
    /* Поверхности: графит с холодным синим подтоном */
    --bg: #0b1017;
    --bg-2: #111822;
    --surface: #151d28;
    --surface-2: #1c2633;
    --surface-3: #243142;
    --line: #283444;
    --line-soft: rgba(120, 150, 190, 0.14);
    --text: #eaf0f7;
    --mut: #9eabbb;
    --dim: #6c7a8c;
    --link: #6cc7ff;

    /* Акцент — «приборный» циан: фокус, следующий шаг, активная вкладка */
    --accent: #3fd6f0;
    --accent-2: #7c8cff;
    --on-accent: #041318;

    /* Смысловые цвета: только статусы и вердикты */
    --ok: #3ddc84;
    --warn: #f3c24b;
    --maint: #f08a3c;
    --bad: #ff5a5f;
    --info: #6ea8ff;
    --unk: #8995a5;
    --on-ok: #04140b;

    --ok-bg: rgba(61, 220, 132, 0.13);
    --warn-bg: rgba(243, 194, 75, 0.13);
    --maint-bg: rgba(240, 138, 60, 0.15);
    --bad-bg: rgba(255, 90, 95, 0.13);
    --info-bg: rgba(110, 168, 255, 0.14);
    --unk-bg: rgba(137, 149, 165, 0.15);
    --accent-bg: rgba(63, 214, 240, 0.12);

    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    --shadow-pop: 0 18px 50px -12px rgba(0, 0, 0, 0.65);
    --sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 42%);

    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
    --glow-period: 3.2s;

    --radius: 18px;
    --radius-sm: 13px;
    --radius-xs: 10px;

    /* Размеры касания и шрифта — всё, что растёт в перчатках */
    --tap: 48px;      /* поля ввода, кнопки карты, квадратные кнопки */
    --row: 58px;      /* строка списка, пункт чек-листа */
    --row-pad: 10px;  /* вертикальный отступ строки; его же вычитает .row > button.grow */
    --btn: 50px;      /* обычная кнопка */
    --primary: 58px;  /* главная кнопка экрана */
    --seg: 44px;      /* сегменты, малые кнопки, чипы-кнопки — не ниже порога 44 */
    --font: 16px;     /* основной текст */
    --font-d: 13px;   /* вторичная строка, подписи */
    --ck-box: 44px;   /* клетка чек-листа */
    --tab-h: 64px;    /* высота панели вкладок */
    --dock-gap: 10px; /* зазор плавающей панели от краёв */

    /* Сила эффектов: режимы меняют только эти числа */
    --fx-glow: 1;       /* множитель свечения */
    --fx-blur: 0px;     /* размытие стекла */
    --card-alpha: 100%; /* непрозрачность карточек */
  }

  /* Широкая гамма: на дисплеях P3 (iPhone, Mac) неон ярче, без выхода
     за sRGB на остальных. */
  @supports (color: oklch(0.5 0.1 200)) {
    @media (color-gamut: p3) {
      :root {
        --accent: oklch(0.84 0.15 205);
        --ok: oklch(0.82 0.21 150);
        --warn: oklch(0.86 0.16 85);
        --bad: oklch(0.7 0.22 22);
        --maint: oklch(0.76 0.17 52);
      }
    }
  }

  :root[data-theme="light"] {
    color-scheme: light;
    /* Цвета подобраны по контрасту WCAG: мелкий текст на белом и на
       подложке чипа — не ниже 4,5:1 (замер 3.0; было 3,5–4,2). */
    --bg: #eef2f7;
    --bg-2: #f7f9fc;
    --surface: #ffffff;
    --surface-2: #f2f5f9;
    --surface-3: #e7ecf3;
    --line: #d8dfe8;
    --line-soft: rgba(30, 50, 80, 0.1);
    --text: #0f1722;
    --mut: #4d5a6a;
    --dim: #5f6b7c;
    --link: #0a64c8;

    --accent: #067591;
    --accent-2: #4c5bd4;
    --on-accent: #ffffff;

    --ok: #0c7a40;
    --warn: #7a5a00;
    --maint: #98450a;
    --bad: #b3262d;
    --info: #1f63c7;
    --unk: #6b7684;
    --on-ok: #ffffff;

    --ok-bg: rgba(12, 122, 64, 0.1);
    --warn-bg: rgba(122, 90, 0, 0.1);
    --maint-bg: rgba(152, 69, 10, 0.1);
    --bad-bg: rgba(179, 38, 45, 0.09);
    --info-bg: rgba(31, 99, 199, 0.09);
    --unk-bg: rgba(107, 118, 132, 0.11);
    --accent-bg: rgba(6, 117, 145, 0.1);

    --shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 8px 24px -16px rgba(20, 40, 70, 0.35);
    --shadow-pop: 0 18px 44px -14px rgba(20, 40, 70, 0.35);
    --sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.7), transparent 40%);
  }

  /* ---- «В перчатках»: крупнее всё, что трогают пальцем ---- */
  :root[data-ui="gloves"] {
    --tap: 60px;
    --row: 70px;
    --row-pad: 12px;
    --btn: 62px;
    --primary: 74px;
    --seg: 56px;
    --font: 18px;
    --font-d: 15px;
    --ck-box: 58px;
    --tab-h: 76px;
    --dock-gap: 0px;
    --radius: 16px;
    --fx-glow: 0;
    /* Контраст выше: вторичный текст светлее, линии заметнее */
    --mut: #b9c4d2;
    --dim: #8e9aab;
    --line: #34435a;
  }
  :root[data-ui="gloves"][data-theme="light"] {
    --mut: #3a4655;
    --dim: #5d6978;
    --line: #c3ccd8;
  }

  /* ---- «Максимум»: стекло и свечение ---- */
  :root[data-ui="max"] {
    --fx-glow: 1.6;
    --fx-blur: 16px;
    --card-alpha: 74%;
    --bg: #070b12;
  }
  :root[data-ui="max"][data-theme="light"] {
    --bg: #e9eef6;
    --card-alpha: 80%;
  }
}

/* == styles/01-base.css == */
/* База: сброс, типографика, фон, фокус. */

@layer reset {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  img, svg { display: block; }
  img { max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { -webkit-tap-highlight-color: transparent; }
  ul, ol { padding-left: 20px; }

  /* Без движения — по системной настройке. Универсальный * не выбирает
     псевдоэлементы, а transition не наследуется, поэтому они перечислены;
     ::backdrop — тоже псевдоэлемент. !important в первом слое сильнее
     любого слоя ниже. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after, ::backdrop {
      transition: none !important;
      animation: none !important;
    }
  }
}

@layer base {
  body {
    background: var(--bg);
    color: var(--text);
    font: var(--font)/1.45 var(--font-ui);
    min-height: 100dvh;
    overscroll-behavior-y: contain;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
  p { text-wrap: pretty; }
  a { color: var(--link); text-decoration: none; }
  a:active { opacity: 0.7; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--mut); }
  .dim { color: var(--dim); }
  .small { font-size: var(--font-d); }
  .xs { font-size: 12px; }
  .spacer { height: 8px; }
  .right { margin-left: auto; }
  .nowrap { white-space: nowrap; }
  .center { text-align: center; }
  .grow { flex: 1; min-width: 0; }
  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .ico14 { display: inline-flex; flex: none; }
  .ico14 svg { width: 14px; height: 14px; }

  .result-normal { color: var(--ok); }
  .result-problem, .result-emergency { color: var(--warn); }
  .result-crash { color: var(--bad); }
  .result-maintenance { color: var(--maint); }
}

/* == styles/02-layout.css == */
/* Каркас: колонка экранов, плавающая панель вкладок (рельса на
   десктопе), шапка экрана, заголовки разделов, две колонки «Сегодня». */

@layer layout {
  #views {
    max-width: 680px;
    margin: 0 auto;
    padding: 14px 16px calc(var(--tab-h) + var(--dock-gap) + 30px + env(safe-area-inset-bottom));
    padding-top: calc(14px + env(safe-area-inset-top));
  }

  /* ---------- Панель вкладок: плавающий док ---------- */
  #tabbar {
    position: fixed;
    left: var(--dock-gap);
    right: var(--dock-gap);
    bottom: calc(var(--dock-gap) + env(safe-area-inset-bottom));
    display: flex;
    justify-content: space-around;
    gap: 2px;
    padding: 5px;
    border-radius: 24px;
    background: color-mix(in srgb, var(--bg-2) 86%, transparent);
    border: 1px solid var(--line-soft);
    box-shadow: var(--shadow-pop);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    z-index: 20;
    max-width: 560px;
    margin: 0 auto;
  }
  #tabbar .tab {
    position: relative;
    flex: 1 1 0;
    min-height: calc(var(--tab-h) - 10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--dim);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    border-radius: 19px;
    transition: color 0.2s var(--ease);
  }
  #tabbar .tab svg { width: 24px; height: 24px; position: relative; z-index: 1; transition: transform 0.25s var(--ease-spring); }
  #tabbar .tab span { position: relative; z-index: 1; }
  #tabbar .tab:active svg { transform: scale(0.88); }
  #tabbar .tab[aria-current="page"] { color: var(--text); }
  #tabbar .tab[aria-current="page"] svg { color: var(--accent); }
  /* Подложка активной вкладки — отдельный элемент с view-transition-name:
     при смене вкладки она переезжает к новой, а не мигает. */
  #tabbar .tab-ind {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent) 6%, transparent));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent);
    view-transition-name: tab-ind;
  }
  /* Точка «идёт полёт» у иконки «Полёт» — видна с любой вкладки */
  #tabbar .tab .live {
    position: absolute;
    top: 7px;
    right: calc(50% - 19px);
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 2px var(--bg-2);
    z-index: 2;
  }

  /* ---------- Шапка экрана ---------- */
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 16px;
    min-height: 44px;
  }
  .head h1 { font-size: 27px; line-height: 1.12; font-weight: 750; letter-spacing: -0.02em; }
  .head .grow { flex: 1; min-width: 0; }
  .head .sub { color: var(--mut); font-size: var(--font-d); margin-top: 3px; }
  .back {
    width: var(--seg); height: var(--seg);
    margin-left: -8px;
    flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--mut);
    border-radius: 50%;
  }
  .back svg { width: 24px; height: 24px; }
  .back:active { background: var(--surface-2); }
  .head .head-act {
    color: var(--accent);
    font-size: 15px; font-weight: 600;
    min-height: var(--seg);
    padding: 0 12px;
    flex: none;
    white-space: nowrap;
    border-radius: 999px;
    background: var(--accent-bg);
  }
  .head .head-act:active { transform: scale(0.97); }
  .head .head-act { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .head .head-act-ic { display: none; }
  .head .head-act-ic svg { width: 22px; height: 22px; }
  .head .head-ic {
    width: var(--seg); height: var(--seg);
    margin-right: -6px;
    padding: 0;
    flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--mut);
    border-radius: 50%;
    background: none;
  }
  .head .head-ic svg { width: 23px; height: 23px; }
  .head .head-ic[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
  .head .head-help { color: var(--dim); }
  .head .head-act + .head-help { margin-left: 2px; }

  /* Состояние дня в подписи шапки «Сегодня» */
  .state-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 1px 9px 1px 7px;
    border-radius: 999px;
    font-size: 12px; font-weight: 650;
    vertical-align: 1px;
    color: var(--c, var(--mut));
    background: color-mix(in srgb, var(--c, var(--mut)) 14%, transparent);
  }
  .state-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .state-pill.field, .state-pill.flying { --c: var(--ok); }
  .state-pill.debrief { --c: var(--info); }
  .state-pill.home { --c: var(--accent); }

  /* ---------- Заголовок раздела ---------- */
  .h2 {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--mut);
    margin: 24px 2px 9px;
  }
  .h2::before {
    content: "";
    align-self: center;
    width: 3px; height: 12px;
    border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 calc(8px * var(--fx-glow)) var(--accent);
    flex: none;
  }
  .h2 .cnt { color: var(--dim); font-weight: 550; letter-spacing: 0; text-transform: none; }
  .h3 { font-weight: 650; margin: 14px 0 6px; }

  /* ---------- «Сегодня»: две колонки ----------
     Разметка одна: .today-main (шапка, баннеры, блоки состояния) и
     aside.today-side (условия, полёты дня, копия). На телефоне обёртки
     прозрачны для раскладки (display: contents), #views — flex-колонка,
     порядок задаёт order: шапка (0) → герой дня (1) → условия (2) →
     остальное (3) → полёты дня и копия (4) → блоки после них, .late (5). */
  @media (max-width: 899px) {
    #views.two-col { display: flex; flex-direction: column; }
    .today-main, .today-side { display: contents; }
    .today-main > * { order: 3; }
    .today-main > .today-top { order: 0; }
    .today-main > .card.hero, .today-main > .stat-line, .today-main > .ready-panel { order: 1; }
    .today-main > .late { order: 5; }
    .today-side > * { order: 4; }
    .today-side > .wx-slot { order: 2; }
    .side-only { display: none; }
    #views.two-col .today-main > .h2, #views.two-col .today-side > .h2 { margin-top: 12px; }
    #views.two-col .today-main > .btn { margin-bottom: 10px; }
  }

  /* ---------- Десктоп и планшет от 900 px ----------
     Панель — вертикальная рельса слева; «Сегодня» — две колонки,
     остальные экраны — одна колонка 760 px. */
  @media (min-width: 900px) {
    #tabbar {
      inset: 12px auto 12px 12px;
      width: 88px;
      max-width: none;
      margin: 0;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 6px;
      padding: 12px 6px;
    }
    #tabbar .tab { flex: none; width: 74px; min-height: 66px; }
    #views { margin: 0 auto 0 100px; max-width: 1140px; padding: 24px 32px 32px; }
    /* Экраны в одну колонку — по центру свободного места правее рельсы,
       а не прижаты к ней (ревью 3.0: справа пустовало ~400 px). */
    #views:not(.two-col) { max-width: 812px; margin-left: max(112px, calc((100vw - 812px + 100px) / 2)); }
    #tabbar .tab { font-size: 12px; color: var(--mut); }
    /* Широкие кнопки в колонке 750 px выглядят растянутыми — ограничены */
    #views > .btn, #views > .btn-line, .today-main > .btn { max-width: 460px; }
    .ring ~ .btn, .ring ~ .session-hint, .ring ~ .pills { margin-left: auto; margin-right: auto; max-width: 460px; }
    #views.two-col {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 372px;
      gap: 28px;
      align-items: start;
    }
    .today-main, .today-side { min-width: 0; }
    .today-side > .wx-slot > .h2 { margin-top: 6px; }
  }
  @media (min-width: 1300px) {
    #views.two-col { margin-left: auto; }
  }
}

/* == styles/03-components.css == */
/* Компоненты: карточки, строки, чипы, кнопки, формы, сегменты, пилюли,
   меню, баннеры, шкалы, раскрывашки, окна. */

@layer components {
  /* ---------- Карточки ---------- */
  .card {
    position: relative;
    background: var(--sheen), color-mix(in srgb, var(--surface) var(--card-alpha), transparent);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 15px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .card.flat { padding: 0; overflow: hidden; }

  /* ---------- Строки списков ---------- */
  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: var(--row);
    padding: var(--row-pad) 14px;
    text-align: left;
    background: transparent;
  }
  /* Разделитель с отступом слева — как в системных списках. Линия —
     фоновая картинка, а не псевдоэлемент: ::after занят подсветкой
     следующего шага, ::before — полосой статуса. */
  .row + .row, .ck + .ck, .wxr + .wxr {
    background-image: linear-gradient(var(--line-soft), var(--line-soft));
    background-size: calc(100% - 14px) 1px;
    background-position: right top;
    background-repeat: no-repeat;
  }
  button.row, a.row, .row .row-main { transition: background-color 0.15s var(--ease); }
  button.row:active, a.row:active, .row .row-main:active { background-color: var(--surface-2); }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { display: block; font-size: var(--font); font-weight: 550; }
  .row .d {
    display: block;
    color: var(--mut);
    font-size: var(--font-d);
    margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .d.wrap, dialog .row .d { white-space: normal; }
  .row .chev { color: var(--dim); flex: none; }
  .row .chev svg { width: 18px; height: 18px; }
  .row .row-ic {
    flex: none;
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    border-radius: 12px;
    color: var(--c, var(--mut));
    background: color-mix(in srgb, var(--c, var(--mut)) 12%, transparent);
  }
  .row .row-ic svg { width: 21px; height: 21px; }
  .row .row-main {
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    min-height: var(--seg);
    min-width: 0;
    border-radius: 12px;
  }
  /* Кнопка внутри строки-контейнера растягивается на всю высоту строки,
     включая отступы: иначе область касания — строка текста, а не строка
     списка (порог касания в test:seeded). */
  .row > button.grow {
    align-self: stretch;
    margin-top: calc(-1 * var(--row-pad)); margin-bottom: calc(-1 * var(--row-pad));
    padding-top: var(--row-pad); padding-bottom: var(--row-pad);
  }
  /* Полоса статуса слева у строки борта (data-st) */
  .row[data-st]::before {
    content: "";
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--st-c);
    box-shadow: 0 0 calc(10px * var(--fx-glow)) var(--st-c);
  }
  .row[data-st="ready"] { --st-c: var(--ok); }
  .row[data-st="check"] { --st-c: var(--warn); }
  .row[data-st="maintenance"] { --st-c: var(--maint); }
  .row[data-st="grounded"] { --st-c: var(--bad); }
  .row[data-st="unknown"] { --st-c: var(--unk); }

  .thumb {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: var(--surface-2);
    object-fit: cover;
    flex: none;
    box-shadow: inset 0 0 0 1px var(--line-soft);
  }
  .thumb.ph { display: flex; align-items: center; justify-content: center; color: var(--dim); }
  .thumb.ph svg { width: 27px; height: 27px; }
  .thumb.lg { width: 76px; height: 76px; border-radius: 20px; }
  .thumb.lg.ph svg { width: 36px; height: 36px; }
  .thumb.tap { cursor: zoom-in; }
  .thumb.tap:active { opacity: 0.75; }
  .thumb-btn { flex: none; display: block; border-radius: 20px; cursor: zoom-in; }
  .thumb-btn:active { opacity: 0.85; }

  /* ---------- Чипы статусов ---------- */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 650;
    letter-spacing: 0.02em;
    white-space: nowrap;
    flex: none;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, transparent);
  }
  .chip::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
    box-shadow: 0 0 calc(8px * var(--fx-glow)) currentColor;
  }
  .chip .cl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .st-ready { --c: var(--ok); }
  .st-check { --c: var(--warn); }
  .st-maintenance { --c: var(--maint); }
  .st-grounded { --c: var(--bad); }
  .st-unknown { --c: var(--unk); }
  .st-flown { --c: var(--info); }
  .bt-ready { color: var(--ok); }
  .bt-flown { color: var(--info); }
  /* Чип-действие (заряд АКБ): касание — как у малых кнопок */
  button.chip { cursor: pointer; min-height: var(--seg); padding: 0 14px; transition: transform 0.12s var(--ease); }
  button.chip:active { transform: scale(0.95); }
  .chip-link { cursor: pointer; }
  .chip-link:active { opacity: 0.7; }
  /* В строке чип не выдавливает имя: 40 % ширины и многоточие */
  .row > .chip { flex: 0 1 auto; min-width: 0; max-width: 40%; }
  /* Чип-кнопка (заряд) не режется: подпись у неё без многоточия */
  .row > button.chip { flex: none; max-width: none; }
  /* «заряд?» — то, на что пилоту надо нажать: янтарный, а не серый */
  button.chip.st-unknown[data-act="batt-charge"] { --c: var(--warn); }

  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--mut);
    font-size: 11px;
    font-weight: 600;
    vertical-align: 2px;
    letter-spacing: 0.02em;
  }
  /* online — информация, не тревога: синий, не жёлтый */
  .badge.online { color: var(--info); border-color: color-mix(in srgb, var(--info) 55%, transparent); background: var(--info-bg); }

  /* ---------- Кнопки ---------- */
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    min-height: var(--btn);
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    background: var(--sheen), var(--surface-2);
    border: 1px solid var(--line);
    font-size: var(--font);
    font-weight: 650;
    color: var(--text);
    text-align: center;
    transition: transform 0.1s var(--ease), box-shadow 0.2s var(--ease), background 0.2s var(--ease);
  }
  .btn svg { width: 21px; height: 21px; flex: none; }
  .btn:active { transform: scale(0.975); }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .btn-primary {
    min-height: var(--primary);
    font-size: calc(var(--font) + 1px);
    font-weight: 750;
    letter-spacing: 0.01em;
    color: var(--on-ok);
    border: 0;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 55%),
      linear-gradient(135deg, var(--ok), color-mix(in srgb, var(--ok) 70%, var(--accent)));
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.25) inset,
      0 10px calc(26px * var(--fx-glow)) -10px color-mix(in srgb, var(--ok) 80%, transparent);
  }
  .btn-danger {
    color: var(--bad);
    border-color: color-mix(in srgb, var(--bad) 55%, transparent);
    background: var(--bad-bg);
  }
  /* «Посадка» — единственная кнопка, которую жмут не глядя: крупнее главной */
  .btn-land { min-height: calc(var(--primary) + 12px); font-size: 20px; }
  .btn-sm {
    width: auto;
    min-height: var(--seg);
    padding: 6px 15px;
    font-size: 14.5px;
    font-weight: 600;
    display: inline-flex;
    border-radius: 12px;
    flex: none;
  }
  .btn-sm.btn-primary { min-height: var(--seg); font-size: 15px; }
  .btn + .btn { margin-top: 9px; }
  .row .btn + .btn, .banner .btn + .btn { margin-top: 0; }
  .btn-line { display: flex; gap: 9px; flex-wrap: wrap; }
  .btn-line .btn { flex: 1 1 auto; min-width: 0; white-space: nowrap; margin-top: 0; }
  /* Малая кнопка рядом с полем ввода («Добавить» в сборах) — по содержимому */
  .btn-line > input + .btn-sm { flex: 0 0 auto; }
  .btn-line + .btn-line { margin-top: 9px; }
  /* Квадратная кнопка-иконка в строке (избранное, удалить пункт) */
  .ic-btn {
    width: var(--seg); min-height: var(--seg); flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--dim);
    border-radius: 12px;
  }
  .ic-btn svg { width: 20px; height: 20px; }
  .ic-btn:active { background: var(--surface-2); }
  .ic-btn.on { color: var(--warn); }
  /* Текстовая кнопка-ссылка под главной — полной высоты касания */
  .link-btn {
    display: block; width: 100%; min-height: var(--seg);
    color: var(--link); font-size: 14.5px; font-weight: 600; text-align: center;
    margin-top: 4px;
  }

  /* ---------- Формы ---------- */
  .field { margin-bottom: 13px; }
  .field > label:not(.check-row) {
    display: block;
    font-size: var(--font-d);
    font-weight: 600;
    color: var(--mut);
    margin: 0 2px 5px;
  }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"],
  input[type="search"], select, textarea {
    width: 100%;
    min-height: var(--tap);
    padding: 11px 13px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    font: inherit;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  textarea { min-height: 88px; resize: vertical; field-sizing: content; }
  select {
    appearance: none;
    padding-right: 36px;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
      linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 19px) 50%, calc(100% - 14px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  input[type="file"] { color: var(--mut); font-size: 14px; max-width: 100%; }
  input[type="file"]::file-selector-button {
    font: inherit; font-weight: 600;
    min-height: var(--seg);
    margin-right: 10px;
    padding: 0 14px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }
  ::placeholder { color: var(--dim); opacity: 1; }
  /* Чекбокс: цель касания — вся строка-подпись */
  .check-row {
    display: flex; gap: 12px; align-items: center;
    min-height: var(--seg); padding: 4px 0;
    color: var(--text); font-size: var(--font); cursor: pointer;
  }
  .check-row input[type="checkbox"] {
    width: 24px; height: 24px; flex: none; margin: 0;
    accent-color: var(--ok);
  }
  .field > label:empty { display: none; }
  .field .hint, .hint { font-size: 12.5px; color: var(--dim); margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

  /* ---------- Сегменты ---------- */
  .seg {
    display: flex;
    background: var(--bg-2);
    border: 1px solid var(--line-soft);
    border-radius: 14px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    flex: 1;
    min-height: var(--seg);
    border-radius: 11px;
    color: var(--mut);
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s var(--ease), color 0.2s var(--ease);
  }
  .seg button[aria-pressed="true"] {
    background: var(--sheen), var(--surface-3);
    color: var(--text);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 4px 14px -8px rgba(0, 0, 0, 0.7);
  }
  .seg.four button { font-size: 13px; padding: 0 2px; }
  @media (max-width: 399px) { .seg.four button { font-size: 12.5px; padding: 0 1px; } }
  /* Сегмент с иконками: класс борта в форме */
  .seg-ic button {
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 4px;
    min-height: 66px;
    font-size: 11.5px; line-height: 1.2;
    padding: 6px 2px;
  }
  .seg-ic button svg { width: 25px; height: 25px; }
  .seg-ic button[aria-pressed="true"] svg { color: var(--accent); filter: drop-shadow(0 0 calc(6px * var(--fx-glow)) var(--accent)); }

  /* ---------- Пилюли и селекты-пилюли ---------- */
  .pill-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 6px; scrollbar-width: none; }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: var(--seg);
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    font-size: 14px;
    white-space: nowrap;
    max-width: 100%;
  }
  .pill svg { width: 16px; height: 16px; color: var(--dim); flex: none; }
  .pill > span { overflow: hidden; text-overflow: ellipsis; }
  button.pill { cursor: pointer; }
  .pill.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  select.sel-pill {
    width: auto;
    max-width: 100%;
    min-height: var(--seg);
    padding: 6px 32px 6px 13px;
    border-radius: 999px;
    background-color: var(--surface-2);
    font-size: 14px;
    flex: none;
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  }
  select.sel-pill.sel { border-color: var(--accent); }
  /* Селект по ширине ВЫБРАННОГО пункта (pillSelect): невидимая копия
     подписи (::after из data-v) задаёт ширину, селект лежит поверх
     абсолютно — иначе нативный select растёт по самому длинному пункту. */
  .sel-fit { display: inline-grid; position: relative; flex: 0 1 auto; min-width: 0; max-width: 100%; vertical-align: middle; }
  .sel-fit::after {
    content: attr(data-v);
    visibility: hidden;
    white-space: nowrap;
    font-size: 14px;
    padding: 6px 32px 6px 13px;
    border: 1px solid transparent;
    min-height: var(--seg);
    min-width: 0;
    overflow: hidden;
  }
  .sel-fit.sm::after { font-size: 13px; padding: 4px 28px 4px 11px; }
  .sel-fit > select { position: absolute; inset: 0; width: 100%; height: 100%; min-width: 0; max-width: none; }
  select.sel-sm {
    width: auto;
    min-height: var(--seg);
    padding: 4px 28px 4px 11px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--mut);
    background-color: var(--surface-2);
    flex: none;
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  }

  /* ---------- Меню действий (popover) ---------- */
  .menu {
    position: fixed;
    inset: auto;
    margin: 0;
    padding: 6px;
    min-width: 210px;
    max-width: calc(100vw - 16px);
    max-height: calc(100dvh - 24px);
    overflow-y: auto;
    overscroll-behavior: contain;
    background: color-mix(in srgb, var(--bg-2) 92%, transparent);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    backdrop-filter: blur(20px) saturate(1.4);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow-pop);
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 25;
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex; align-items: center; gap: 11px;
    min-height: var(--tap);
    padding: 0 12px;
    border-radius: 11px;
    font-size: 15px;
    text-align: left;
    white-space: nowrap;
  }
  .menu button svg { width: 20px; height: 20px; color: var(--mut); flex: none; }
  .menu button:active { background: var(--surface-2); }
  .menu button[disabled] { color: var(--dim); cursor: default; }
  .menu[popover]:popover-open {
    display: flex;
    opacity: 1;
    transform: none;
    transition: opacity 0.16s var(--ease), transform 0.16s var(--ease),
      overlay 0.16s var(--ease) allow-discrete, display 0.16s var(--ease) allow-discrete;
  }
  @starting-style {
    .menu[popover]:popover-open { opacity: 0; transform: translateY(-6px) scale(0.98); }
  }
  .menu[popover]::backdrop { background: transparent; }
  .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .menu-grid[popover]:popover-open { display: grid; }
  .menu-grid button { justify-content: center; padding: 0 8px; font-variant-numeric: tabular-nums; }
  .menu-grid .menu-head { grid-column: 1 / -1; justify-content: flex-start; }
  .menu-grid button[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); font-weight: 700; }

  /* ---------- Баннеры ---------- */
  .banner {
    display: flex;
    gap: 11px;
    align-items: flex-start;
    flex-wrap: wrap;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
    border: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--surface) var(--card-alpha), transparent);
    color: var(--mut);
  }
  .banner > svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
  .banner > .grow { flex: 1 1 160px; }
  /* Две кнопки в баннере — отдельной строкой под текстом, рядом друг с другом */
  .banner:has(> .btn + .btn) > .grow { flex-basis: 100%; }
  .banner.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); color: var(--ok); background: var(--ok-bg); }
  .banner.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); background: var(--warn-bg); }
  .banner.backup { align-items: center; }
  .banner.backup > svg { margin-top: 0; }
  .banner .btn-sm { color: var(--text); }

  .empty { text-align: center; color: var(--mut); padding: 40px 16px; }
  .empty svg { width: 52px; height: 52px; color: var(--dim); margin: 0 auto 12px; opacity: 0.8; }
  .empty p { margin-bottom: 16px; }
  .empty .btn-sm { margin: 0 auto; }

  /* ---------- Шкалы, плитки, пары «ключ — значение» ---------- */
  .progress {
    height: 7px;
    border-radius: 4px;
    background: var(--surface-3);
    overflow: hidden;
    margin: 8px 0 4px;
  }
  .progress i {
    display: block; height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--ok) 70%, var(--accent)), var(--ok));
    box-shadow: 0 0 calc(10px * var(--fx-glow)) color-mix(in srgb, var(--ok) 70%, transparent);
    transition: width 0.3s var(--ease);
  }
  .gauge {
    display: block;
    flex: 1;
    min-width: 56px;
    height: 8px;
    border-radius: 4px;
    background: var(--surface-3);
    overflow: hidden;
  }
  .gauge i { display: block; height: 100%; border-radius: 4px; transition: width 0.3s var(--ease); }
  .stat-line { display: flex; gap: 9px; flex-wrap: wrap; margin: 10px 0; }
  .stat {
    flex: 1 1 92px;
    background: var(--sheen), color-mix(in srgb, var(--surface) var(--card-alpha), transparent);
    border: 1px solid var(--line-soft);
    border-radius: 15px;
    padding: 11px 13px;
    box-shadow: var(--shadow);
  }
  .stat .v { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
  .stat .v.warn { color: var(--warn); }
  .stat .k { color: var(--mut); font-size: 12px; margin-top: 2px; }
  .stat-line.four .stat { flex: 1 1 130px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .kv div { display: flex; flex-direction: column; min-width: 0; }
  .kv .k { color: var(--mut); font-size: 12px; }
  .kv .v { font-size: 15px; font-weight: 550; overflow-wrap: anywhere; }

  /* ---------- Раскрывашки ---------- */
  details.fold { border-top: 1px solid var(--line-soft); }
  details.fold summary {
    list-style: none;
    display: flex; align-items: center; gap: 8px;
    min-height: 54px;
    padding: 8px 2px;
    cursor: pointer;
    color: var(--text);
    font-weight: 650;
  }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary::after {
    content: "";
    margin-left: auto;
    width: 8px; height: 8px;
    border-right: 2px solid var(--dim);
    border-bottom: 2px solid var(--dim);
    transform: rotate(45deg);
    transition: transform 0.2s var(--ease);
  }
  details.fold[open] summary::after { transform: rotate(-135deg); }
  /* Длинные списки (каталог, история) не раскладываются, пока не видны */
  details.fold .fold-body { padding: 0 2px 14px; content-visibility: auto; contain-intrinsic-size: auto 400px; }
  /* Журнал длиннее 20 строк: карточки дней раскладываются по мере
     прокрутки, заглушка — по числу строк (--n) */
  .card.flat.cv {
    content-visibility: auto;
    contain-intrinsic-size: auto calc(((var(--font) + var(--font-d)) * 1.45 + 22px) * var(--n, 3) - 1px);
  }

  /* ---------- Код и сравнение ---------- */
  .diff, .pre {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow-x: auto;
    white-space: pre;
  }
  .diff { padding: 10px 0; }
  .diff div { padding: 0 12px; }
  .diff .add { background: var(--ok-bg); color: var(--ok); }
  .diff .del { background: var(--bad-bg); color: var(--bad); }
  .pre { padding: 10px 12px; max-height: 50vh; }

  /* Таблица в окне «Как считается» */
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th, .tbl td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line-soft); }
  .tbl th { color: var(--mut); font-weight: 650; font-size: 12.5px; }
  .tbl td:first-child { color: var(--mut); }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl .wx-bad { color: var(--bad); white-space: nowrap; }
  .tbl .wx-warn { color: var(--warn); white-space: nowrap; }

  /* ---------- Модальные окна: лист снизу ---------- */
  dialog {
    border: 1px solid var(--line-soft);
    border-bottom: 0;
    border-radius: 24px 24px 0 0;
    background: var(--sheen), var(--bg-2);
    color: var(--text);
    width: 100%;
    max-width: 660px;
    margin: auto auto 0;
    padding: 0;
    max-height: 92dvh;
    box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, 0.7);
    /* Лист въезжает снизу; уезжает (класс closing) — узел убирает
       closeModal по transitionend. display/overlay с allow-discrete
       нужны, чтобы вход анимировался из @starting-style. */
    transition: transform 0.28s var(--ease), opacity 0.28s var(--ease),
      overlay 0.28s var(--ease) allow-discrete, display 0.28s var(--ease) allow-discrete;
  }
  dialog[open] { transform: translateY(0); opacity: 1; }
  dialog:focus, dialog:focus-visible { outline: none; }
  @starting-style {
    dialog[open] { transform: translateY(40px); opacity: 0; }
  }
  dialog.closing { transform: translateY(40px); opacity: 0; transition-duration: 0.16s; }
  /* Ручка листа */
  dialog::before {
    content: "";
    display: block;
    width: 40px; height: 5px;
    margin: 8px auto 0;
    border-radius: 3px;
    background: var(--line);
  }
  @media (min-width: 700px) {
    dialog { border-radius: 24px; margin: auto; border-bottom: 1px solid var(--line-soft); }
    dialog::before { display: none; }
  }
  dialog::backdrop {
    background: rgba(2, 6, 12, 0.6);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    transition: opacity 0.28s var(--ease), overlay 0.28s var(--ease) allow-discrete, display 0.28s var(--ease) allow-discrete;
  }
  dialog[open]::backdrop { opacity: 1; }
  @starting-style {
    dialog[open]::backdrop { opacity: 0; }
  }
  dialog.closing::backdrop { opacity: 0; transition-duration: 0.16s; }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px 4px 20px; }
  .dlg-head h2 { font-size: 19px; font-weight: 750; flex: 1; }
  .dlg-close {
    width: var(--seg); height: var(--seg);
    display: flex; align-items: center; justify-content: center;
    color: var(--mut);
    border-radius: 50%;
    background: var(--surface-2);
  }
  .dlg-close svg { width: 20px; height: 20px; }
  .dlg-body { padding: 10px 20px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; }
  body.locked { overflow: hidden; }
}

/* == styles/04-screens.css == */
/* Экраны: «Сегодня», погода, чек-лист, полёт (HUD), борт, флот,
   журнал и статистика, «Ещё», окна фото и карты, приветствие. */

@layer screens {
  /* ================= «Сегодня» ================= */

  /* Панель готовности: три шкалы-кольца — флот, АКБ, погода */
  .ready-panel {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
    margin-bottom: 10px;
  }
  .gauge-tile {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 6px 11px;
    min-height: var(--seg);
    border-radius: var(--radius);
    background: var(--sheen), color-mix(in srgb, var(--surface) var(--card-alpha), transparent);
    border: 1px solid var(--line-soft);
    box-shadow: var(--shadow);
    text-align: center;
    transition: transform 0.12s var(--ease);
  }
  .gauge-tile:active { transform: scale(0.97); }
  .gauge-ring {
    --c: var(--ok);
    position: relative;
    width: 62px; height: 62px;
    display: grid; place-items: center;
    border-radius: 50%;
    transition: --p 0.9s var(--ease);
  }
  @starting-style { .gauge-ring { --p: 0; } }
  .gauge-ring::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface-3) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    filter: drop-shadow(0 0 calc(5px * var(--fx-glow)) color-mix(in srgb, var(--c) 70%, transparent));
  }
  .gauge-ring b { font-family: var(--mono); font-size: 15px; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.05; }
  .gauge-ring b i { display: block; font-family: var(--font-ui); font-style: normal; font-size: 9.5px; font-weight: 650; letter-spacing: 0.02em; color: var(--mut); }
  .gauge-ring svg { width: 26px; height: 26px; color: var(--c); }
  .gauge-tile .gt-t { font-size: 13px; font-weight: 700; margin-top: 3px; }
  .gauge-tile .gt-d { font-size: 11.5px; color: var(--mut); line-height: 1.25; }

  /* Шаги «Начала работы»: прогресс и строки */
  .onb-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 6px; }
  .onb-head .t { display: block; font-weight: 750; font-size: 16px; }
  .onb-head .d { display: block; color: var(--mut); font-size: var(--font-d); }
  .onb-head .progress { margin: 8px 0 2px; }
  .row.done { opacity: 0.55; }
  .row.done .t { text-decoration: line-through; }
  .row.done .row-ic { --c: var(--ok); }

  /* Герой дня: борт на поле, идущий полёт, карточка борта */
  .hero { padding: 16px; }
  .hero-top { display: flex; align-items: center; gap: 14px; margin-bottom: 15px; }
  .hero-top .grow { flex: 1; min-width: 0; }
  .hero-name { display: block; font-size: 21px; font-weight: 750; line-height: 1.2; letter-spacing: -0.015em; }
  .hero .d { display: block; color: var(--mut); font-size: var(--font-d); margin-top: 2px; white-space: normal; }
  .hero .hero-ok { display: flex; align-items: center; gap: 5px; margin-top: 5px; color: var(--ok); }
  .hero .btn { margin-top: 0; }
  .banner.nocharge { align-items: center; }
  .hero .btn + .btn { margin-top: 9px; }
  .hero-kicker {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 750; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--c, var(--accent));
    margin-bottom: 10px;
  }
  .hero-kicker::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 calc(10px * var(--fx-glow)) currentColor;
  }
  .hero-flight { --c: var(--ok); }
  .hero-flight .timer { margin: 2px 0 14px; font-size: 56px; }
  .hero-flight .kick-land { --c: var(--mut); }

  /* Карточка погоды — целиком кнопка в «Окна» */
  .wx-hero { display: block; width: 100%; text-align: left; padding: 13px 15px; }
  .wx-hero:active { background-color: var(--surface-2); }
  .wx-hero-top { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .wx-hero-top .grow { flex: 1; min-width: 0; }
  .wx-hero .row-ic {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 12px;
    color: var(--info); background: var(--info-bg);
  }
  .wx-hero .row-ic svg { width: 21px; height: 21px; }
  .wx-hero .t { display: block; font-size: 17px; font-weight: 750; line-height: 1.25; text-wrap: balance; }
  .wx-hero .t.ok { color: var(--ok); }
  .wx-hero .t.warn { color: var(--warn); }
  .wx-hero .t.muted { color: var(--mut); }
  .wx-hero .d { display: block; color: var(--mut); font-size: var(--font-d); margin-top: 2px; }
  .wx-hero .chev { color: var(--dim); flex: none; }
  .wx-hero .chev svg { width: 18px; height: 18px; }

  /* Полоска 24 часов: сегмент на час, ночь приглушена, выбранный час
     обведён. Цвет — переменная --c: у <i> на самом элементе, у кнопок
     (.strip.tap на экране «Окна») — на ::before: цель касания высотой
     с клетку, а полоса — 16 px. */
  .strip { display: flex; gap: 2px; height: 16px; border-radius: 5px; overflow: hidden; }
  .strip > * { flex: 1 1 0; display: block; min-width: 0; background: var(--c, var(--surface-3)); }
  .strip .g { --c: var(--ok); }
  .strip .y { --c: var(--warn); }
  .strip .r { --c: var(--bad); }
  .strip .n { opacity: 0.5; }
  .strip .now { outline: 2px solid var(--text); outline-offset: -2px; border-radius: 3px; opacity: 1; box-shadow: 0 0 calc(12px * var(--fx-glow)) var(--text); }
  .strip.tap { height: var(--ck-box); overflow: visible; border-radius: 0; }
  .strip.tap button { background: none; position: relative; padding: 0; border-radius: 0; cursor: pointer; }
  .strip.tap button::before {
    content: "";
    position: absolute; left: 0; right: 0;
    top: calc(50% - 9px); height: 18px;
    background: var(--c, var(--surface-3));
    transition: transform 0.12s var(--ease);
  }
  .strip.tap button:first-child::before { border-radius: 5px 0 0 5px; }
  .strip.tap button:last-child::before { border-radius: 0 5px 5px 0; }
  .strip.tap button:active::before { transform: scaleY(1.35); }
  .strip.tap .now { outline: none; box-shadow: none; }
  .strip.tap .now::before {
    outline: 2px solid var(--text); outline-offset: -2px; border-radius: 4px;
    transform: scaleY(1.45);
    box-shadow: 0 0 calc(14px * var(--fx-glow)) var(--c);
  }
  .strip.tap button:focus-visible { outline: none; }
  .strip.tap button:focus-visible::before { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
  .ticks {
    display: flex; justify-content: space-between;
    color: var(--dim); font-size: 11px; font-family: var(--mono);
    margin-top: 5px;
  }

  /* ================= Окна для полётов ================= */
  .day-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 2px; }
  .day-chip { padding: 5px 10px; font-size: 12.5px; gap: 6px; flex: none; }
  .day-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-3); flex: none; }
  .day-chip i.g { background: var(--ok); box-shadow: 0 0 calc(6px * var(--fx-glow)) var(--ok); }
  .day-chip i.y { background: var(--warn); box-shadow: 0 0 calc(6px * var(--fx-glow)) var(--warn); }
  .day-chip i.r { background: var(--bad); box-shadow: 0 0 calc(6px * var(--fx-glow)) var(--bad); }
  .wx-strip-card { padding: 8px 15px 12px; }
  .wx-strip-sub { margin-top: 7px; }
  .wx-hour-top { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
  .wx-hour-top .grow { flex: 1; min-width: 0; }
  .wx-ic { color: var(--mut); flex: none; display: flex; }
  .wx-ic svg { width: 22px; height: 22px; }
  .wx-hour .wx-ic svg { width: 30px; height: 30px; color: var(--info); }
  .load-line { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
  .wx-fold { margin-top: 14px; }
  .wxr { padding: 9px 14px; }
  .wxr-top { display: flex; align-items: center; gap: 10px; }
  .wxr-top .chip { min-width: 100px; justify-content: center; }
  .wxr-sub { color: var(--mut); font-size: 12.5px; margin-top: 4px; }
  .wxr.night { background-color: rgba(0, 0, 0, 0.18); }
  :root[data-theme="light"] .wxr.night { background-color: rgba(20, 40, 80, 0.05); }
  .wxr.night .mono { color: var(--dim); }
  .wxr.sel { box-shadow: inset 3px 0 0 var(--accent); }
  .wxr.sel .mono { color: var(--text); }
  .windy-box { margin-top: 8px; }
  .wx-alt { display: inline-flex; align-items: center; gap: 6px; }
  .wx-alt svg { width: 16px; height: 16px; transform: rotate(90deg); color: var(--mut); }

  /* ================= Чек-лист ================= */
  .prep-pills { align-items: center; margin-bottom: 10px; overflow: visible; }
  .prep-pills .map-btn { width: var(--tap); min-height: var(--tap); border-radius: 999px; }
  .prep-batt { flex-wrap: wrap; }
  .prog-line { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
  .prog-line .progress { flex: 1; margin: 0; }
  .prog-hint { margin-bottom: 9px; }
  .ck {
    position: relative;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 9px 12px 9px 14px;
    min-height: var(--row);
    transition: background-color 0.2s var(--ease);
  }
  .ck .grow { flex: 1; min-width: 0; }
  .ck .t { display: block; font-size: var(--font); font-weight: 550; }
  .ck .d { display: block; color: var(--mut); font-size: calc(var(--font-d) - 0.5px); }
  .ck .ck-main {
    flex: 1; min-width: 0;
    display: flex; align-items: center;
    text-align: left;
    min-height: var(--ck-box);
    padding: 0;
  }
  .ck .ck-main .grow { flex: 1; min-width: 0; }
  .ck .ck-main:active { opacity: 0.7; }
  .ck .st {
    flex: none;
    width: var(--ck-box); height: var(--ck-box);
    border-radius: 13px;
    border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
    background: var(--bg-2);
    transition: background 0.18s var(--ease), border-color 0.18s var(--ease), color 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  .ck .st svg { width: 23px; height: 23px; }
  .ck button.st { padding: 0; cursor: pointer; }
  .ck button.st:active { transform: scale(0.92); }
  .ck[data-state="ok"] .st {
    color: var(--on-ok); border-color: var(--ok);
    background: linear-gradient(135deg, var(--ok), color-mix(in srgb, var(--ok) 75%, var(--accent)));
    box-shadow: 0 0 calc(14px * var(--fx-glow)) -2px var(--ok);
  }
  .ck[data-state="ok"] .t { color: var(--mut); }
  .ck[data-state="skip"] .st { color: var(--unk); background: var(--unk-bg); }
  .ck[data-state="skip"] .t { color: var(--dim); text-decoration: line-through; }
  .ck[data-state="fail"] { background-color: var(--bad-bg); }
  .ck[data-state="fail"] .st { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 0 calc(14px * var(--fx-glow)) -2px var(--bad); }
  /* Меню трёх состояний: встроено в строку переносом */
  .ck-menu { flex-basis: 100%; display: flex; gap: 6px; padding: 8px 0 2px; }
  .ck-menu button {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    min-height: var(--ck-box);
    padding: 0 4px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    font-size: 13.5px; font-weight: 600;
  }
  .ck-menu button svg { width: 18px; height: 18px; flex: none; }
  .ck-menu button span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 379px) { .ck-menu button svg { display: none; } }
  .ck-menu button[data-state="ok"] { color: var(--ok); }
  .ck-menu button[data-state="fail"] { color: var(--bad); }
  .ck-menu button[data-state="skip"] { color: var(--mut); }
  .ck-menu button[aria-pressed="true"] { background: var(--surface-3); border-color: currentColor; font-weight: 750; }
  /* Липкая панель действий над панелью вкладок */
  .act-bar {
    position: sticky;
    bottom: calc(var(--tab-h) + var(--dock-gap) + env(safe-area-inset-bottom));
    margin: 10px -16px 0;
    padding: 24px 16px 12px;
    background: linear-gradient(to top, var(--bg) 78%, color-mix(in srgb, var(--bg) 0%, transparent));
    z-index: 5;
  }
  .act-bar .banner { margin-bottom: 8px; padding: 9px 12px; font-size: 13.5px; align-items: center; background-color: var(--bg); }
  .act-bar .banner.warn { background: linear-gradient(var(--warn-bg), var(--warn-bg)), var(--bg); }
  .act-bar .banner > svg { margin-top: 0; }
  .act-bar .btn + .btn { margin-top: 8px; }
  @media (min-width: 900px) {
    .act-bar {
      bottom: 0; margin-left: -32px; margin-right: -32px; padding-left: 32px; padding-right: 32px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px;
    }
    .act-bar .banner { grid-column: 1 / -1; margin-bottom: 0; }
    .act-bar .btn + .btn { margin-top: 0; }
  }

  /* ================= Полёт: HUD ================= */
  .mono-lg, .timer {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .timer {
    font-size: 58px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.02em;
    margin: 18px 0;
    line-height: 1;
  }
  @keyframes colon-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .timer .colon { animation: colon-blink 1s ease-in-out infinite; }
  .timer.landed { color: var(--mut); }
  .timer.landed .colon { animation: none; }
  .air-state {
    display: flex; justify-content: center; margin: 2px 0 4px;
  }
  .air-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 13px 5px 11px;
    border-radius: 999px;
    font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--c, var(--ok));
    background: color-mix(in srgb, var(--c, var(--ok)) 13%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--ok)) 30%, transparent);
  }
  .air-pill::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 calc(10px * var(--fx-glow)) currentColor;
  }
  .air-pill.landed { --c: var(--mut); }
  .air-pill.alarm { --c: var(--warn); }
  .ring {
    --size: min(76vw, 292px);
    --c: var(--ok);
    width: var(--size); height: var(--size);
    margin: 10px auto 10px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .ring svg.r { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring .ring-track { fill: none; stroke: var(--surface-3); stroke-width: 10; }
  .ring .ring-ticks { fill: none; stroke: var(--line); stroke-width: 7; opacity: 0.9; }
  .ring .ring-fill {
    fill: none;
    stroke: var(--c);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.4s var(--ease);
    filter: drop-shadow(0 0 calc(8px * var(--fx-glow)) color-mix(in srgb, var(--c) 80%, transparent));
  }
  .ring.landed { --c: var(--mut); }
  .ring.over { --c: var(--warn); }
  .ring-in { text-align: center; position: relative; padding: 0 16px; }
  .ring .timer { font-size: clamp(44px, 14vw, 60px); margin: 0; }
  .ring-sub { margin-top: 8px; }
  .pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0 16px; }
  .wake-ind {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--mut); font-size: 12px;
    white-space: nowrap; flex: none;
  }
  .wake-ind[hidden] { display: none; }
  .session-hint { text-align: center; margin-top: 14px; }
  .alarm-btn[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
  .alarm-btn[aria-pressed="true"] svg { color: var(--warn); }

  /* ================= Карточка борта ================= */
  .seg.model-tabs { margin: 4px 0 13px; }
  .hero-line { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .hero-line > .sel-fit { flex: none; max-width: 100%; }
  .hero-line > .chip { flex: none; }
  .hero-batt { margin: -4px 0 13px; }
  .model-hero .hint { font-size: 12.5px; color: var(--dim); margin: -6px 0 10px; }
  .model-hero .stat-line { margin: 0; }
  .model-hero .stat { flex: 1 1 0; min-width: 0; padding: 9px 11px; background: var(--bg-2); box-shadow: none; }
  .model-hero .stat .v { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .model-hero .btn { margin-top: 13px; }
  .svc-line { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
  .svc-line .progress { flex: 1; margin: 0; }
  .svc-sub { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: var(--dim); font-size: 12px; }
  .svc-sub .grow { flex: 1; min-width: 0; }

  /* ================= Флот ================= */
  .fleet-bar { display: flex; gap: 8px; margin-bottom: 10px; align-items: stretch; }
  .fleet-bar select { flex: 1; min-height: var(--seg); }
  .fleet-row .row-main { min-width: 45%; }
  .grp-head {
    display: flex; align-items: center; gap: 8px;
    margin: 16px 2px 7px;
    font-weight: 700;
    font-size: 15px;
  }
  .grp-head.grp-sub, .card.grp-sub, .grp-empty.grp-sub { margin-left: 16px; }
  .grp-head .grp-edit, .row .row-move {
    width: var(--seg); min-height: var(--seg); height: var(--seg);
    flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
    border-radius: 12px;
  }
  .grp-head .grp-edit svg { width: 18px; height: 18px; }
  .row .row-move svg { width: 20px; height: 20px; }
  .grp-empty { margin: 2px 2px 8px; }

  /* ================= Журнал и статистика ================= */
  /* Подпись — дорожка — значение: одна сетка на все строки, дорожки
     начинаются и кончаются на одной вертикали. */
  .bar-row {
    display: grid;
    grid-template-columns: minmax(84px, 34%) minmax(40px, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
  }
  .bar-row .n {
    color: var(--mut);
    font-size: var(--font-d);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-track {
    flex: 1 1 auto;
    min-width: 0;
    height: 9px;
    border-radius: 5px;
    background: var(--surface-3);
    overflow: hidden;
  }
  .bar-track i {
    display: block; height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    box-shadow: 0 0 calc(10px * var(--fx-glow)) color-mix(in srgb, var(--accent) 60%, transparent);
    transition: width 0.3s var(--ease);
  }
  .bar-row .v {
    min-width: 78px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 600;
  }
  /* Календарь лётных дней: 12 недель × 7 дней, яркость — налёт дня */
  .heat {
    max-width: 460px;
    display: grid;
    grid-template-rows: repeat(7, 1fr);
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 4px;
  }
  .heat i {
    aspect-ratio: 1;
    border-radius: 4px;
    background: var(--surface-3);
  }
  .heat i[data-l="1"] { background: color-mix(in srgb, var(--ok) 35%, var(--surface-3)); }
  .heat i[data-l="2"] { background: color-mix(in srgb, var(--ok) 60%, var(--surface-3)); }
  .heat i[data-l="3"] { background: var(--ok); box-shadow: 0 0 calc(8px * var(--fx-glow)) color-mix(in srgb, var(--ok) 60%, transparent); }
  .heat i.today { outline: 1.5px solid var(--text); outline-offset: 1px; }
  .heat i.future { background: transparent; }
  .heat-legend { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; color: var(--dim); font-size: 11.5px; }
  .heat-legend .sw { display: inline-flex; gap: 3px; align-items: center; }
  .heat-legend .sw i { width: 10px; height: 10px; border-radius: 3px; background: var(--surface-3); display: inline-block; aspect-ratio: auto; }
  .heat-legend .sw i[data-l="1"] { background: color-mix(in srgb, var(--ok) 35%, var(--surface-3)); }
  .heat-legend .sw i[data-l="2"] { background: color-mix(in srgb, var(--ok) 60%, var(--surface-3)); }
  .heat-legend .sw i[data-l="3"] { background: var(--ok); }

  /* ================= «Ещё»: выбор режима интерфейса ================= */
  .mode-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mode-card {
    display: flex; flex-direction: column; align-items: stretch; gap: 7px;
    padding: 8px 8px 10px;
    min-height: var(--seg);
    border-radius: 15px;
    border: 1.5px solid var(--line);
    background: var(--bg-2);
    text-align: center;
    font-size: 13px; font-weight: 650;
    color: var(--mut);
    transition: border-color 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .mode-card[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--text);
    box-shadow: 0 0 0 1px var(--accent) inset, 0 0 calc(18px * var(--fx-glow)) -6px var(--accent);
  }
  .mode-card small { display: block; font-size: 11px; font-weight: 500; color: var(--dim); line-height: 1.25; }
  /* Мини-превью режима: схематичный экран */
  .mode-prev {
    height: 64px;
    border-radius: 10px;
    padding: 7px;
    display: flex; flex-direction: column; gap: 5px;
    background: var(--bg);
    border: 1px solid var(--line-soft);
    overflow: hidden;
  }
  .mode-prev i { display: block; height: 9px; border-radius: 3px; background: var(--surface-3); }
  .mode-prev i:nth-child(2) { width: 70%; }
  .mode-prev b { display: block; height: 18px; margin-top: auto; border-radius: 6px; background: var(--ok); }
  .mode-prev.gloves { gap: 7px; }
  .mode-prev.gloves i { height: 13px; }
  .mode-prev.gloves b { height: 24px; border-radius: 5px; }
  .mode-prev.max {
    background:
      radial-gradient(60% 60% at 20% 0%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 70%),
      radial-gradient(60% 60% at 100% 100%, color-mix(in srgb, var(--accent-2) 45%, transparent), transparent 70%),
      var(--bg);
  }
  .mode-prev.max i { background: color-mix(in srgb, var(--text) 16%, transparent); }
  .mode-prev.max b { box-shadow: 0 0 12px var(--ok), 0 0 0 1.5px var(--accent); }

  /* ================= Мини-карта (OSM) ================= */
  .site-map-box:not([hidden]) { margin-top: 12px; }
  .mp { margin-bottom: 10px; }
  .map-btn, .mp-search .mp-go, .mp-zoom button {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
  }
  .map-btn { flex: none; width: var(--tap); min-height: var(--tap); color: var(--mut); }
  .map-btn svg { width: 22px; height: 22px; }
  .mp-search { display: flex; gap: 8px; margin-bottom: 8px; }
  .mp-search .mp-q { flex: 1; min-width: 0; }
  .mp-search .mp-go { padding: 0 15px; min-height: var(--tap); font-weight: 600; }
  .mp-found { margin: 0 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mp-view {
    position: relative;
    height: 300px;
    overflow: hidden;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    touch-action: none;
    cursor: crosshair;
  }
  .mp-layer { position: absolute; inset: 0; }
  .mp-pin {
    position: absolute;
    transform: translate(-50%, -100%);
    color: var(--bad);
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
  }
  .mp-pin svg { width: 32px; height: 32px; }
  .mp-bar { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .mp-bar .mp-hint { flex: 1; }
  .mp-bar a { color: var(--dim); }
  .mp-zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .mp-zoom button { width: 48px; height: 48px; color: var(--text); font-size: 24px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
  .mp-zoom button:active { background: var(--surface-3); }

  /* ================= Слоты картинок (assets/art) =================
     Правила с самими файлами вставляет сборка (слой art) — только для
     существующих. Здесь — как слот выглядит, когда картинка есть. */
  .thumb.ph[data-art] { background: var(--art-img, none) center / cover no-repeat, var(--surface-2); }
  .welcome-art {
    display: none;
    width: 100%;
    max-width: 380px;
    aspect-ratio: 3 / 2;
    margin: -4px auto 10px;
    background: var(--art-img, none) center / contain no-repeat;
  }
  .empty-art { display: flex; justify-content: center; }

  /* ================= Приветствие и инструкция ================= */
  .welcome { text-align: center; padding: 6px 4px 4px; }
  .welcome-ic {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 76px; height: 76px;
    border-radius: 50%;
    color: var(--accent);
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--accent) 22%, transparent), var(--surface-2) 70%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent), 0 0 calc(30px * var(--fx-glow)) -6px var(--accent);
    margin-bottom: 16px;
  }
  .welcome-ic svg { width: 36px; height: 36px; }
  .welcome h3 { font-size: 21px; font-weight: 750; margin-bottom: 8px; }
  .welcome p { color: var(--mut); font-size: 15px; line-height: 1.45; margin-bottom: 16px; min-height: 4.4em; }
  .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); transition: width 0.25s var(--ease), background 0.25s var(--ease); }
  .dots i.on { width: 22px; background: var(--accent); box-shadow: 0 0 calc(8px * var(--fx-glow)) var(--accent); }
  .help-intro { margin: -4px 2px 12px; }
  .help details.fold { scroll-margin-top: 8px; }
  .help details.fold:last-child { border-bottom: 1px solid var(--line-soft); }
  .help .fold-body p, .help .fold-body ul { font-size: 15px; line-height: 1.55; margin-bottom: 10px; }
  .help .fold-body li { margin-bottom: 6px; }
  .help .fold-body .banner { margin-top: 4px; }
  .help .fold-body .card.flat { margin-bottom: 10px; }

  /* ================= Фото во весь экран ================= */
  dialog.photo {
    width: 100%;
    max-width: none;
    height: 100dvh;
    max-height: 100dvh;
    margin: 0;
    border-radius: 0;
    border: 0;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
  }
  dialog.photo::before { display: none; }
  @media (min-width: 700px) { dialog.photo { margin: 0; border-radius: 0; } }
  dialog.photo .dlg-head { padding-top: calc(14px + env(safe-area-inset-top)); }
  dialog.photo .dlg-close { color: #fff; background: rgba(255, 255, 255, 0.12); }
  dialog.photo .dlg-body {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    padding: 0 0 calc(8px + env(safe-area-inset-bottom));
    overflow: hidden;
  }
  .pv { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pv-view {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }
  /* width/height: auto — рамка картинки совпадает со снимком: на этом
     держится ограничение панорамы в pvApply. */
  .pv-img {
    width: auto; height: auto;
    max-width: 100%; max-height: 100%;
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
  }
  .pv-bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 16px; }
  .pv-scale { min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; color: #aab; }
  .pv-cap { text-align: center; padding: 0 16px 6px; margin: 0; }
  dialog.photo .btn { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.18); color: #fff; }
}

/* == styles/05-effects.css == */
/* Эффекты: фон (картинка из assets/art + процедурная аврора), подсветка
   следующего шага, живые рамки важных объектов, переходы экранов.

   Анимации свечения синхронизированы: сборка экрана пересоздаёт узлы,
   и без общей фазы бегущая рамка прыгала бы в начало при каждой
   перерисовке. paint() ставит --glow-phase = −(время mod период) —
   новые узлы стартуют с той же точки, где были старые. */

@layer effects {
  /* ---------- Фон ----------
     html::before — картинка фона (assets/art/bg-*.webp; сборка объявляет
     --art-bg-* только для существующих файлов, иначе слой пуст);
     body::before — процедурное свечение (в «Максимуме» — аврора);
     body::after — приборная сетка («Максимум»). Все слои fixed и ниже
     интерфейса; анимируется только transform — это работа компоновщика,
     не перерисовка. */
  :root {
    --art-bg: var(--art-bg-dark, none);
    --art-opacity: 0.55;
  }
  :root[data-theme="light"] { --art-bg: var(--art-bg-light, none); }
  @media (min-width: 900px) {
    :root { --art-bg: var(--art-bg-dark-wide, var(--art-bg-dark, none)); }
    :root[data-theme="light"] { --art-bg: var(--art-bg-light-wide, var(--art-bg-light, none)); }
  }
  html::before, body::before, body::after {
    content: "";
    position: fixed;
    z-index: -1;
    pointer-events: none;
  }
  html::before {
    inset: 0;
    background: var(--art-bg) center / cover no-repeat;
    opacity: var(--art-opacity);
  }
  body::before {
    inset: 0;
    background:
      radial-gradient(90% 45% at 50% -8%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 70%),
      radial-gradient(70% 40% at 100% 110%, color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 70%);
  }
  body::after { display: none; }

  @keyframes aurora {
    0% { transform: translate3d(-4%, -2%, 0) rotate(0deg) scale(1); }
    50% { transform: translate3d(3%, 2%, 0) rotate(8deg) scale(1.08); }
    100% { transform: translate3d(-2%, 4%, 0) rotate(-6deg) scale(1.03); }
  }

  /* ---------- Следующий шаг: светящаяся рамка ----------
     data-next ставит paint() на ОДИН элемент экрана (nextStep()).
     Цена важна — рамка светится всё время, пока открыт экран:
     «Стандарт» — неподвижное кольцо + тень, «дышит» только opacity
     псевдоэлемента (работа компоновщика, без перерисовки); бегущий
     «комета»-блик (@property --glow-a, перерисовка каждый кадр) — только
     в «Максимуме», где за эффект осознанно платят батареей. */
  @keyframes glow-spin { to { --glow-a: 360deg; } }
  @keyframes next-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  [data-next] {
    position: relative;
    box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 calc(22px * var(--fx-glow)) -4px var(--accent);
  }
  [data-next]::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: inherit;
    padding: 2px;
    pointer-events: none;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 35%, transparent) 45%, var(--accent-2) 80%, var(--accent));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation: next-breathe var(--glow-period) ease-in-out infinite;
    animation-delay: var(--glow-phase, 0s);
    will-change: opacity;
  }
  /* Внутри карточки-списка рамка рисуется внутрь: карточка обрезает всё,
     что выходит за её край. */
  .card.flat [data-next] { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent), inset 0 0 calc(20px * var(--fx-glow)) -8px var(--accent); }
  .card.flat [data-next]::after { inset: 0; }
  /* Главная кнопка следующим шагом: своё зелёное свечение + рамка */
  .btn-primary[data-next] {
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 0 0 2px color-mix(in srgb, var(--accent) 80%, transparent),
      0 10px calc(34px * var(--fx-glow)) -8px var(--ok);
  }
  /* Без движения: рамка ровная, не дышит */
  @media (prefers-reduced-motion: reduce) {
    [data-next]::after { opacity: 1; }
  }

  /* ---------- Важные объекты: градиентная рамка героя ---------- */
  .card.hero {
    border-color: transparent;
    background:
      var(--sheen) padding-box,
      linear-gradient(color-mix(in srgb, var(--surface) var(--card-alpha), transparent), color-mix(in srgb, var(--surface) var(--card-alpha), transparent)) padding-box,
      linear-gradient(140deg, color-mix(in srgb, var(--accent) 55%, transparent), var(--line-soft) 38%, var(--line-soft) 62%, color-mix(in srgb, var(--accent-2) 45%, transparent)) border-box;
  }
  .hero-flight {
    background:
      var(--sheen) padding-box,
      linear-gradient(color-mix(in srgb, var(--surface) var(--card-alpha), transparent), color-mix(in srgb, var(--surface) var(--card-alpha), transparent)) padding-box,
      linear-gradient(140deg, color-mix(in srgb, var(--ok) 60%, transparent), var(--line-soft) 40%, var(--line-soft) 60%, color-mix(in srgb, var(--accent) 45%, transparent)) border-box;
  }

  /* «Идёт полёт» — точка на вкладке и в шапке дышит */
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 2px color-mix(in srgb, var(--ok) 60%, transparent); }
    70% { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 10px transparent; }
  }
  #tabbar .tab .live { animation: live-pulse 1.8s ease-out infinite; }
  @keyframes dot-breathe { 50% { opacity: 0.45; } }
  .air-pill:not(.landed)::before, .state-pill.flying::before { animation: dot-breathe 1.4s ease-in-out infinite; }

  /* Превышение обычной длительности: кольцо полёта пульсирует */
  @keyframes ring-alarm { 50% { filter: drop-shadow(0 0 calc(16px * var(--fx-glow) + 4px) var(--warn)); } }
  .ring.over .ring-fill { animation: ring-alarm 1.2s ease-in-out infinite; }

  /* ---------- Переходы между экранами (View Transitions) ----------
     render() ставит html[data-vt]: forward — новый экран въезжает справа,
     back — зеркально, tab — только прозрачность, update (render(true)) —
     корень не моргает, анимируются лишь элементы с view-transition-name
     (клетка чек-листа). Подложка активной вкладки (tab-ind) и фото борта
     (ac-*) переезжают на новое место сами — это морф общего элемента. */
  ::view-transition { pointer-events: none; }
  ::view-transition-group(*) { animation-duration: 0.32s; animation-timing-function: var(--ease); }
  @keyframes vt-in-fwd { from { transform: translateX(28px); opacity: 0; } }
  @keyframes vt-in-back { from { transform: translateX(-28px); opacity: 0; } }
  @keyframes vt-out { to { opacity: 0; } }
  @keyframes vt-fade-in { from { opacity: 0; } }
  @keyframes ck-pop { from { transform: scale(0.82); opacity: 0.3; } }
  html[data-vt="forward"]::view-transition-new(root) { animation: vt-in-fwd 0.22s var(--ease); }
  html[data-vt="forward"]::view-transition-old(root) { animation: vt-out 0.14s var(--ease) forwards; }
  html[data-vt="back"]::view-transition-new(root) { animation: vt-in-back 0.22s var(--ease); }
  html[data-vt="back"]::view-transition-old(root) { animation: vt-out 0.14s var(--ease) forwards; }

  :root[data-ui="max"] .card.hero {

  :root[data-ui="max"] [data-next]::after {

  @supports (animation-timeline: view()) {

      animation-timeline: view();
      animation-range: entry 0% entry 60%;
    }
  }
}

/* == styles/07-print.css == */
/* Печать журнала.
   Фон листа задаётся ЯВНО у тела: тёмная тема базовая, у html фона нет,
   и фон body уходит на холст листа (замер 2026-09-07: заливка во всю
   область листа). Белый только у html не спасает. min-height снимается
   ради WebKit: он при печати считает vh от окна и выталкивает пустой лист.
   Перенос в ЛЮБОМ месте — только колонкам со свободным текстом (борт,
   АКБ, локация, заметки): длинное слово растягивало таблицу за край.
   Всем ячейкам его давать нельзя — служебные колонки режут слова посреди
   слога. Поля страницы и заливку шапки не навязываем: это выбор
   владельца в диалоге печати. Фоновые слои (картинка, аврора, сетка)
   на лист не попадают. */

@layer print {
  #print-area { display: none; }
  @media print {
    html, body { background: #fff; min-height: 0; }
    html::before, body::before, body::after { display: none !important; }
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block; color: #000; background: #fff; font-size: 12pt; }
    #print-area h1 { font-size: 16pt; margin-bottom: 4pt; }
    #print-area p { margin-bottom: 8pt; }
    #print-area table { width: 100%; border-collapse: collapse; }
    #print-area th, #print-area td {
      border: 1pt solid #444;
      padding: 3pt 5pt;
      text-align: left;
      vertical-align: top;
      font-size: 10pt;
    }
    #print-area td:nth-child(3), #print-area td:nth-child(5),
    #print-area td:nth-child(6), #print-area td:last-child { overflow-wrap: anywhere; }
    #print-area th { background: #eee; }
    #print-area tr { break-inside: avoid; }
  }
}
