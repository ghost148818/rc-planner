// RC Planner · Следующий шаг: что сделать сейчас и какая кнопка это делает.

/* ============================================================
   СЛЕДУЮЩИЙ ШАГ (3.0)
   nextStep() — один источник «что дальше» для всего приложения: полёт
   в воздухе → посадка → итог → заряд → взлёт → осмотр после проблемы →
   шаг обучения → зарядить АКБ → резервная копия → начать полёт →
   собрать борт → добавить борт. Возвращает { key, sels, views, tab }:
     sels  — селекторы кнопки по приоритету (с id записи, чтобы попасть
             ровно в свою строку, а не в первую похожую);
     views — экраны, где шаг уместен (нет — везде);
     tab   — вкладка, которую подсветить, если кнопки на экране нет
             (только срочное: идёт полёт).
   Экранные шаги (чек-лист, сборы, окна) — localStep(): внутри экрана
   «что дальше» своё, и оно важнее общего.
   Подсветку ставит paint() атрибутом data-next ровно на ОДИН элемент —
   шаг не решает за пилота, а показывает, куда смотреть. Разметка
   экранов про подсветку не знает.
============================================================ */

function nextStep() {
  const act = activeSessions();
  const inAir = act.find((s) => !s.landedAt);
  if (inAir) {
    return { key: 'land', views: null, tab: 'flight',
      sels: [`[data-act="land-flight"][data-id="${inAir.id}"]`, `[data-nav="#/session/${inAir.id}"]`] };
  }
  const landed = act[0];
  if (landed) {
    return { key: 'finish', views: null, tab: 'flight',
      sels: [`[data-act="finish-flight"][data-id="${landed.id}"]`, `[data-nav="#/session/${landed.id}"]`] };
  }
  const ready = S.aircraft.filter((a) => takeoffReady(a))
    .sort((x, y) => (y.prepared.at || 0) - (x.prepared.at || 0));
  if (ready.length) {
    const a = ready[0];
    const b = armedBattery(a);
    if (!chargeKnown(b)) {
      return { key: 'charge', views: ['today', 'flight', 'model', 'batteries'],
        sels: [`.hero [data-act="batt-charge"][data-id="${b.id}"]`, `[data-act="batt-charge"][data-id="${b.id}"]`] };
    }
    return { key: 'takeoff', views: ['today', 'flight', 'model'],
      sels: [`[data-act="takeoff-prepared"][data-id="${a.id}"]`] };
  }
  // Сегодняшний полёт с проблемой без закрытой работы новее него
  const today = S.sessions.filter((s) => s.end && s.date === todayISO() && s.result && s.result !== 'normal');
  for (const s of today) {
    const fixed = S.maintenance.some((m) => m.aircraftId === s.aircraftId && m.done && m.createdAt >= s.start);
    if (fixed || !S.aircraft.some((a) => a.id === s.aircraftId)) continue;
    const open = S.maintenance.find((m) => m.aircraftId === s.aircraftId && !m.done && (m.createdAt || 0) >= s.start);
    return { key: 'inspect', views: ['today', 'model'],
      sels: open ? [`[data-act="edit-maint"][data-id="${open.id}"]`] : [`[data-act="add-maint"][data-id="${s.aircraftId}"]`] };
  }
  const onb = onboardingSteps();
  if (onb.todo) {
    // На «Сегодня» — строка шага, на других экранах — та же кнопка
    // действия (шаг «Добавьте борт» подсветит «Добавить» во «Флоте»).
    const i = onb.steps.findIndex((st) => !st[2]);
    return { key: 'onboarding', views: null, sels: [`[data-onb="${i}"]`, `.head [${onb.steps[i][3]}]`, `[${onb.steps[i][3]}]`] };
  }
  const flown = S.batteries.find((b) => b.charge === 'flown' && b.status !== 'retired');
  if (flown) {
    return { key: 'recharge', views: ['today', 'batteries'],
      sels: [`[data-act="batt-charge"][data-id="${flown.id}"]`, '[data-act="batts-charged-all"]'] };
  }
  if (backupDue()) return { key: 'backup', views: ['today', 'backup', 'more'], sels: ['[data-act="export-all"]'] };
  if (armedFleet().length) {
    return { key: 'start', views: ['today', 'flight', 'journal'],
      sels: ['.btn-primary[data-act="start-prep"]', '[data-act="start-prep"]'] };
  }
  if (S.aircraft.length) return { key: 'arm', views: ['today', 'model'], sels: ['[data-next-arm]'] };
  return { key: 'add', views: ['today', 'fleet', 'flight'], sels: ['[data-act="add-model"]'] };
}

// Шаг внутри экрана: чек-лист — выбрать АКБ, отметить заряд, первый
// пустой пункт, затем «Начать полёт»; сборы — первый несобранный пункт;
// окна — «Показать прогноз», пока его нет.
function localStep() {
  if (UI.view === 'prep' && UI.prep) {
    const a = S.aircraft.find((x) => x.id === UI.prep.aircraftId);
    const b = armedBattery(a);
    if (!b) return { key: 'prep-batt', sels: ['select[name="prepBatt"]'] };
    if (!chargeKnown(b)) return { key: 'prep-charge', sels: [`.prep-batt [data-act="batt-charge"][data-id="${b.id}"]`] };
    const i = UI.prep.items.findIndex((it) => !it.state);
    if (i >= 0) return { key: 'prep-item', sels: [`.ck[data-ck="${i}"]`] };
    if (UI.prep.items.some((it) => it.state === 'fail')) return { key: 'prep-fail', sels: [] };
    return { key: 'prep-go', sels: ['[data-act="start-flight"]'] };
  }
  if (UI.view === 'pack') {
    const p = S.packing.find((x) => x.id === UI.arg);
    const i = p ? p.items.findIndex((it) => !it.done) : -1;
    if (i >= 0) return { key: 'pack-item', sels: [`.ck[data-ck="${i}"]`] };
    return null;
  }
  if (UI.view === 'weather' && !UI.wx.data && !UI.wx.loading) {
    return { key: 'wx-load', sels: ['[data-act="weather-load"]'] };
  }
  return null;
}

// Подсветка шага на свежей разметке. Фаза анимаций — общая для всех
// перерисовок (см. 05-effects.css): рамка не прыгает в начало.
const GLOW_PERIOD_MS = 3200;
function applyNext() {
  const now = performance.now();
  const root = document.documentElement.style;
  root.setProperty('--glow-phase', -(now % GLOW_PERIOD_MS).toFixed(0) + 'ms');
  let step = null;
  try { step = localStep() || nextStep(); } catch (e) { step = null; }
  UI.next = step;
  if (!step) return;
  const here = !step.views || step.views.includes(UI.view);
  // Селекторы собраны из id записей — те проверены validateBackup
  // ([\w.-]), но подсветка не стоит падения экрана: ошибка — без подсветки.
  try {
    if (here) {
      for (const sel of step.sels) {
        const el = document.querySelector('#views ' + sel);
        if (el) { el.setAttribute('data-next', step.key); return; }
      }
    }
  } catch (e) { return; }
  if (step.tab && TAB_OF[UI.view] !== step.tab) {
    const t = document.querySelector(`#tabbar .tab[data-nav="#/${step.tab}"]`);
    if (t) t.setAttribute('data-next', step.key);
  }
}

// Короткий отклик вибрацией на важные касания (отметка пункта, взлёт,
// посадка). Локальный API; где его нет (iPhone) — просто ничего.
function haptic(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) { /* нет — и не надо */ }
}

/* == src/10-today.js == */
// RC Planner · Экран «Сегодня»: четыре состояния дня.

/* ============================================================
   6. ЭКРАНЫ
============================================================ */

/* ---------- «Сегодня»: один экран, четыре состояния дня ----------
   flying — идёт полёт (или сел без итога); field — есть борт с
   пройденным чек-листом (takeoffReady); debrief — сегодня уже летали;
   home — всё остальное. Одна главная кнопка на состояние. */
function todayState() {
  if (activeSessions().length) return 'flying';
  if (S.aircraft.some((a) => takeoffReady(a))) return 'field';
  if (S.sessions.some((s) => s.end && s.date === todayISO())) return 'debrief';
  return 'home';
}

// Строка борта на «Сегодня»: превью, имя, тип и АКБ; справа — right
// (кнопка «Чек-лист»/«Взлёт» или чип статуса). Тап по строке — карточка.
function todayAircraftRow(a, right) {
  const b = armedBattery(a);
  return `<div class="row">
    <button class="grow row-main" data-nav="#/model/${a.id}">
      ${aircraftThumb(a)}<span class="grow"><span class="t">${esc(a.name)}</span>
      <span class="d">${TYPES[a.type] || ''}${b ? ' · ' + battTag(b) + (CHARGE_LABEL[b.charge] ? ' · ' + CHARGE_LABEL[b.charge] : '') : ''}</span></span></button>
    ${right}
  </div>`;
}

// Правая часть строки борта: подготовлен — «Взлёт» (только через
// takeoffReady), готов — «Чек-лист», иначе чип статуса.
function todayAircraftAction(a) {
  // Заряд не отмечен — вместо «Взлёт» чип: борт остаётся готовым, тап
  // прямо здесь отмечает состояние и возвращает кнопку.
  if (takeoffReady(a)) {
    const b = armedBattery(a);
    return chargeKnown(b) ? `<button class="btn btn-sm btn-primary" data-act="takeoff-prepared" data-id="${a.id}">Взлёт</button>` : chargeChip(b);
  }
  const st = statusOf(a);
  return st === 'ready' || st === 'unknown'
    ? `<button class="btn btn-sm" data-act="start-prep" data-id="${a.id}">Чек-лист</button>`
    : chip(st, a.id);
}

// Блок бортов: title — заголовок, list — борта, cnt — счётчик в заголовке.
function todayFleetBlock(title, list, cnt) {
  if (!list.length) return '';
  return `<div class="h2">${title}${cnt ? ` <span class="cnt">${cnt}</span>` : ''}</div><div class="card flat">` +
    list.map((a) => todayAircraftRow(a, todayAircraftAction(a))).join('') + '</div>';
}

// Строка «Пора осмотреть» по регламенту — на «Сегодня» в трёх состояниях.
function todayDueRow(a, sv) {
  return `<div class="row"><span class="row-ic">${ICONS.tools}</span>
    <button class="grow row-main" data-nav="#/model/${a.id}"><span class="grow">
      <span class="t" style="color:var(--maint)">Пора осмотреть: ${esc(a.name)}</span>
      <span class="d">${svcSinceText(sv)} с последнего обслуживания · регламент ${svcEveryText(sv)}</span></span></button>
    <button class="btn btn-sm" data-act="add-maint" data-id="${a.id}" data-kind="inspection" data-title="Осмотр по регламенту">Осмотр</button>
  </div>`;
}

function todayOpenMaintRow(m) {
  const a = S.aircraft.find((x) => x.id === m.aircraftId);
  return rowBtn(`data-act="edit-maint" data-id="${m.id}"`,
    `<span class="grow"><span class="t">${esc(m.title)}</span>
     <span class="d">${esc(a ? a.name : '')} · ${fmtDate(m.date)}${m.next ? ' · далее: ' + esc(m.next) : ''}</span></span>`, 'tools');
}

// «Обслуживание»: подошедший регламент + открытые работы (до пяти).
// late — блок идёт после «Полётов сегодня» из правой колонки (телефон).
function todayMaintBlock(withDue, skipIds, late) {
  const open = S.maintenance.filter((m) => !m.done && !(skipIds && skipIds.has(m.id)));
  const due = withDue ? S.aircraft.map((a) => [a, svcState(a)]).filter(([, sv]) => sv && sv.due) : [];
  if (!open.length && !due.length) return '';
  const l = late ? ' late' : '';
  return `<div class="h2${l}">Обслуживание <span class="cnt">${open.length + due.length}</span></div><div class="card flat${l}">` +
    due.map(([a, sv]) => todayDueRow(a, sv)).join('') +
    open.slice(0, 5).map(todayOpenMaintRow).join('') + '</div>';
}

// Баннер резервной копии (home/field): копии не было или она старше 14 дней.
function backupBannerHtml() {
  if (!backupDue()) return '';
  const days = backupAgeDays();
  return `<div class="banner backup">${ICONS.backup}<span class="grow">${days == null
    ? 'Резервной копии ещё не было'
    : `Резервная копия — ${days} ${plural(days, 'день', 'дня', 'дней')} назад`}</span>
    <button class="btn-sm btn" data-act="export-all">Сохранить</button></div>`;
}

// Подпись под датой в шапке: состояние дня словами — пилюлей с точкой.
const TODAY_HINT = { home: 'дома', field: 'на поле', flying: 'в полёте', debrief: 'разбор дня' };

// «Начало работы»: пять шагов, каждый ведёт прямо к действию.
// Первый запуск — засчитано всё, что уже есть (since = 0, предикаты те же,
// что были до 2.0.2). «Пройти обучение заново» кладёт в rcp.tour метку
// времени перезапуска, и тогда засчитывается только сделанное ПОСЛЕ неё:
// createdAt борта, АКБ и локации, end полёта, lastBackupAt. Записи без
// createdAt (заведённые до 2.0.2 или пришедшие из копии) в обучении не
// считаются — это и есть «заново». Старое значение '1' — как первый запуск.
function onboardingSteps() {
  const raw = +lsGet('rcp.tour') || 0;
  const since = raw > 1e12 ? raw : 0;
  const fresh = (t) => (+t || 0) >= since;
  const steps = [
    ['Добавьте борт', 'во «Флоте»: готовая платформа или свой',
      S.aircraft.some((a) => fresh(a.createdAt)), 'data-act="add-model"', 'fleet'],
    // Засчитывается собранный борт, у которого нов сам борт ИЛИ его АКБ:
    // на обучении заново можно поставить в новый борт старую батарею —
    // «поставьте в борт» выполнено. При since = 0 это armedFleet().length > 0.
    ['Заведите аккумулятор и поставьте в борт', 'борт с АКБ считается собранным к вылету',
      armedFleet().some((a) => fresh(a.createdAt) || fresh(armedBattery(a).createdAt)), 'data-act="add-batt"', 'batteries'],
    ['Запомните локацию с координатами', 'GPS или карта — для прогноза и окон полётов',
      S.sites.some((s) => s.lat != null && fresh(s.createdAt)), 'data-act="add-site"', 'sites'],
    ['Пройдите чек-лист и слетайте', 'кнопка «Начать полёт» — журнал заполнится сам',
      S.sessions.some((s) => s.end && fresh(s.end)), 'data-act="start-prep"', 'flight'],
    ['Сохраните резервную копию', 'один файл со всем — единственная страховка данных',
      +S.settings.lastBackupAt > 0 && fresh(S.settings.lastBackupAt), 'data-act="export-all"', 'backup'],
  ];
  return { steps, todo: steps.filter((s) => !s[2]).length, tour: raw > 0 };
}

function viewToday() {
  const state = todayState();
  const date = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  let h = pageHead('Сегодня', { sub: `${date} <span class="state-pill ${state}">${TODAY_HINT[state]}</span>`, help: 'today' });

  if (UI.updateReady) {
    h += `<div class="banner ok">Доступно обновление приложения.
      <button class="btn-sm btn right" data-act="update-app">Обновить</button></div>`;
  }

  // Блок сам исчезает, когда весь путь пройден, — ничего не настраивается.
  // Приветствие первого запуска — отдельное окно (openWelcome в старте).
  const { steps, todo, tour } = onboardingSteps();
  // Экскурсия пройдена до конца — метка снимается сама, как гаснет блок
  // при первом запуске; «Завершить обучение» делает то же раньше времени.
  if (tour && !todo) lsSet('rcp.tour', '');
  const onboarding = todo > 0;

  // В полёте герой — сам полёт; в остальных состояниях баннеры идущих
  // полётов невозможны (иначе состояние было бы flying).
  const live = state === 'flying' ? activeSessions()[0] : null;
  h += activeFlightBanners(live && live.id);

  if (onboarding) {
    // «Обучение заново» — тот же путь, что при первом запуске: пройденные
    // шаги зачёркиваются, блок исчезает, когда не осталось ни одного.
    const doneN = steps.length - todo;
    h += `<div class="h2">${tour ? 'Обучение' : 'Начало работы'} · осталось ${todo} из ${steps.length}</div><div class="card flat onb">
      <div class="onb-head"><span class="grow"><span class="t">Шаг ${doneN + 1} из ${steps.length}</span>
        <span class="d">подсветка ведёт к следующему действию</span>
        <span class="progress"><i style="width:${Math.round(doneN / steps.length * 100)}%"></i></span></span></div>`;
    h += steps.map(([t, d, ok2, attrs, icon], i) => ok2
      ? `<div class="row done"><span class="row-ic">${ICONS.check}</span>
         <span class="grow"><span class="t">${t}</span></span></div>`
      : rowBtn(attrs + ` data-onb="${i}"`, `<span class="grow"><span class="t">${t}</span><span class="d wrap">${d}</span></span>`, icon)).join('');
    if (tour) h += rowBtn('data-act="dismiss-tour"', `<span class="grow"><span class="t">Завершить обучение</span><span class="d wrap">Скрыть этот блок</span></span>`);
    h += '</div>';
  }

  // Две колонки (2.0): .today-main — шапка, баннеры и блоки состояния,
  // aside.today-side — условия, полёты за день, баннер копии. От 900 px
  // колонки стоят рядом; на телефоне их складывает CSS (display: contents
  // + order): условия — сразу под шапкой, остальное — следом за основной.
  if (!S.aircraft.length && state !== 'flying') {
    return `<div class="today-main"><div class="today-top">${h}</div></div>`;
  }
  const part = state === 'flying' ? todayFlying(live)
    : state === 'field' ? todayField()
    : state === 'debrief' ? todayDebrief()
    : todayHome(onboarding);
  return `<div class="today-main"><div class="today-top">${h}</div>${part.main}</div>
    <aside class="today-side">${part.side}</aside>`;
}

// Панель готовности (3.0): три шкалы-кольца одним взглядом — сколько
// бортов собрано и готово, сколько АКБ заряжено, можно ли лететь сейчас
// (по свежему кэшу прогноза, без запросов). Тап — на нужный экран.
// В перчатках скрыта (.opt): там только главное.
function readyPanelHtml() {
  if (!S.aircraft.length) return '';
  const armed = armedFleet();
  const readyN = armed.filter((a) => ['ready', 'unknown'].includes(statusOf(a))).length;
  const batts = S.batteries.filter((b) => b.status !== 'retired');
  const charged = batts.filter((b) => b.charge === 'ready').length;
  const pct = (n, d) => (d ? Math.round(n / d * 100) : 0);
  let wx = { p: 0, c: 'var(--unk)', v: ICONS.weather, t: 'нет прогноза' };
  try {
    const c = wxCacheFresh();
    const idx = c ? (c.json.daily.time || []).indexOf(wxTodayISO()) : -1;
    const lim = wxLimitsOf(armed[0]);
    const day = idx < 0 ? null : wxDay(c.json, idx, lim.maxW, lim.alt);
    const hr = day && day.hours.find((x) => x.hh === wxNowHour());
    if (hr) {
      const load = wxHourLoad(hr, lim.maxW);
      wx = {
        p: hr.verdict === 'bad' ? 100 : Math.max(8, Math.round(Math.min(1, load) * 100)),
        c: hr.verdict === 'ok' ? 'var(--ok)' : hr.verdict === 'warn' ? 'var(--warn)' : 'var(--bad)',
        v: `<b>${wxNum(hr.w10)}<i>м/с</i></b>`, t: WX_WORDS[hr.verdict] + ' сейчас',
      };
    }
  } catch (e) { /* кэш не разобран — плитка без прогноза */ }
  const tile = (nav, p, c, v, title, sub, label) => `<button class="gauge-tile" data-nav="${nav}" aria-label="${label}">
      <span class="gauge-ring" style="--p:${p};--c:${c}">${v}</span>
      <span class="gt-t">${title}</span><span class="gt-d">${sub}</span></button>`;
  return `<div class="ready-panel opt">
    ${tile('#/fleet', pct(readyN, S.aircraft.length), 'var(--ok)', `<b>${readyN}/${S.aircraft.length}</b>`,
      'Флот', 'готовы к вылету', `Флот: готовы ${readyN} из ${S.aircraft.length}`)}
    ${tile('#/batteries', pct(charged, batts.length), 'var(--accent)', `<b>${charged}/${batts.length}</b>`,
      'АКБ', 'заряжены', `Аккумуляторы: заряжены ${charged} из ${batts.length}`)}
    ${tile('#/weather', wx.p, wx.c, wx.v, 'Погода', wx.t, 'Погода сейчас: ' + wx.t)}
  </div>`;
}

// Правая колонка «Сегодня»: условия (герой или строка), полёты за день,
// баннер копии. Заголовок «Условия» показывается только на десктопе —
// на телефоне карточка погоды и так стоит под шапкой.
// Дома полётов за день нет — вместо них «Последние» (три последних),
// но только на десктопе (.side-only): на телефоне этот блок с «Сегодня»
// убран осознанно (пакет 3), а правую колонку иначе нечем занять.
function todaySide(wx, flights, backup) {
  let h = '';
  if (wx) h += `<div class="wx-slot"><div class="h2 side-only">Условия</div>${wx}</div>`;
  if (flights && flights.length) {
    const mins = flights.reduce((n, s) => n + (s.durationMin || 0), 0);
    h += `<div class="h2">Полёты сегодня <span class="cnt">${flights.length} ${plural(flights.length, 'полёт', 'полёта', 'полётов')} · ${fmtDur(mins)}</span></div>`;
    h += logGroupedHtml(flights, null, true);
  } else if (!flights) {
    const recent = S.sessions.filter((s) => s.end).sort((x, y) => y.start - x.start).slice(0, 3);
    if (recent.length) {
      h += `<div class="side-only recent-slot"><div class="h2">Последние <span class="cnt">${S.sessions.filter((s) => s.end).length}</span></div>
        ${logGroupedHtml(recent, S.sessions)}
        <div class="card flat">${rowBtn('data-nav="#/journal"', '<span class="grow"><span class="t">Весь журнал</span></span>', 'journal')}</div></div>`;
    }
  }
  if (backup) h += backup;
  return h;
}

// Завершённые полёты за сегодня — для правой колонки.
function todayFlights() {
  return S.sessions.filter((s) => s.end && s.date === todayISO()).sort((x, y) => y.start - x.start);
}

// Дома: погода из кэша, «Перед выездом», главная кнопка, «К вылету»,
// открытое обслуживание, напоминание о копии.
function todayHome(onboarding) {
  let h = readyPanelHtml();
  const armed = armedFleet();

  // Перед выездом: сборы, разряженные АКБ, подошедший регламент.
  // Сборы без шума: строкой с «Продолжить» — только начатые наборы;
  // нетронутые («0 из N») схлопываются в одну строку «Собраться на
  // выезд», и она показывается лишь когда начатых нет; полностью
  // собранные — строкой с подписью «собран», без кнопки.
  const packDone = (p) => p.items.filter((i) => i.done).length;
  const packFull = (p) => p.items.length > 0 && packDone(p) === p.items.length;
  const started = S.packing.filter((p) => !packFull(p) && packDone(p) > 0);
  const untouched = S.packing.filter((p) => !packFull(p) && packDone(p) === 0);
  const fullPacks = S.packing.filter(packFull);
  const flown = S.batteries.filter((b) => b.charge === 'flown' && b.status !== 'retired');
  const due = S.aircraft.map((a) => [a, svcState(a)]).filter(([, sv]) => sv && sv.due);
  if (S.packing.length || flown.length || due.length) {
    h += '<div class="h2">Перед выездом</div><div class="card flat">';
    h += started.map((p) => `<div class="row"><span class="row-ic">${ICONS.packing}</span>
        <button class="grow row-main" data-nav="#/pack/${p.id}"><span class="grow">
          <span class="t">${esc(p.name)}</span>
          <span class="d">${packDone(p)} из ${p.items.length} собрано</span></span></button>
        <button class="btn btn-sm" data-nav="#/pack/${p.id}">Продолжить</button>
      </div>`).join('');
    if (!started.length && untouched.length) {
      const n = untouched.length;
      h += rowBtn('data-nav="#/packing"', `<span class="grow"><span class="t">Собраться на выезд</span>
        <span class="d">${n} ${plural(n, 'набор', 'набора', 'наборов')}</span></span>`, 'packing');
    }
    h += fullPacks.map((p) => `<div class="row"><span class="row-ic">${ICONS.packing}</span>
        <button class="grow row-main" data-nav="#/pack/${p.id}"><span class="grow">
          <span class="t">${esc(p.name)}</span>
          <span class="d">собран</span></span></button>
        <span class="chip st-ready">собран</span>
      </div>`).join('');
    h += flown.map((b) => {
      const cyc = Math.round(+b.cycles) || 0; // из копии — не обязательно число
      return `<div class="row"><span class="row-ic">${ICONS.bolt}</span>
        <button class="grow row-main" data-act="edit-batt" data-id="${b.id}"><span class="grow">
          <span class="t">Зарядить: ${esc(b.label)}</span>
          <span class="d">после полёта · ${cyc} ${plural(cyc, 'цикл', 'цикла', 'циклов')}</span></span></button>
        <button class="chip st-flown" data-act="batt-charge" data-id="${b.id}">${CHARGE_LABEL.flown}</button>
      </div>`;
    }).join('');
    h += due.map(([a, sv]) => todayDueRow(a, sv)).join('');
    h += '</div>';
  }

  if (armed.length) h += `<button class="btn btn-primary" data-act="start-prep">Начать полёт</button>`;

  // К вылету: только собранные борта (с установленным АКБ) — весь флот
  // живёт во вкладке «Флот». Пустой блок при видимом «Начале работы»
  // не показываем — шаг 2 говорит то же самое.
  if (armed.length) {
    h += todayFleetBlock('К вылету', armed, `${armed.length} из ${S.aircraft.length}`);
  } else if (!onboarding) {
    h += '<div class="h2">К вылету</div><div class="card flat">' +
      rowBtn('data-nav="#/fleet" data-next-arm', `<span class="grow"><span class="t">Соберите борт к вылету</span>
      <span class="d wrap">Установите аккумулятор в карточке борта — он появится здесь</span></span>`, 'batteries') + '</div>';
  }

  h += todayMaintBlock(false);
  return { main: h, side: todaySide(wxHeroOrRow(armed[0]), null, backupBannerHtml()) };
}

// На поле: герой — подготовленный борт с кнопкой «Взлёт», ниже
// полоска погоды, остальные собранные борта и обслуживание.
function todayField() {
  const ready = S.aircraft.filter((a) => takeoffReady(a))
    .sort((x, y) => (y.prepared.at || 0) - (x.prepared.at || 0));
  const hero = ready[0];
  const b = armedBattery(hero);
  const site = S.sites.find((s) => s.id === hero.prepared.siteId);
  let h = `<div class="card hero">
    <div class="hero-kicker">${chargeKnown(b) ? 'Готов к вылету' : 'Почти готов'}${ready.length > 1 ? ` · ещё ${ready.length - 1}` : ''}</div>
    <div class="hero-top">
      ${aircraftThumb(hero, true)}
      <span class="grow">
        <span class="hero-name">${esc(hero.name)}</span>
        <span class="d">${TYPES[hero.type] || ''}${b ? ' · ' + battTag(b) + (CHARGE_LABEL[b.charge] ? ' · ' + CHARGE_LABEL[b.charge] : '') : ''}</span>
        <span class="d hero-ok"><span class="ico14">${ICONS.check}</span>Чек-лист пройден в ${fmtTime(hero.prepared.at)}${site ? ' · ' + esc(site.name) : ''}</span>
      </span>
    </div>
    ${chargeKnown(b)
      ? `<button class="btn btn-primary" data-act="takeoff-prepared" data-id="${hero.id}">${ICONS.takeoff}Взлёт</button>`
      : `<div class="banner warn nocharge">${ICONS.batteries}<span class="grow">Отметьте заряд аккумулятора — и появится «Взлёт».</span>${chargeChip(b)}</div>`}
  </div>`;
  const rest = armedFleet().filter((a) => a.id !== hero.id);
  h += todayFleetBlock('Остальные борта', rest, String(rest.length));
  h += todayMaintBlock(true);
  return { main: h, side: todaySide(wxHeroOrRow(hero, true), todayFlights(), backupBannerHtml()) };
}

// В полёте: карточка полёта с живым таймером, «Открыть полёт» и
// «Посадка»; ниже — как на поле, без героя взлёта.
function todayFlying(s) {
  const a = S.aircraft.find((x) => x.id === s.aircraftId);
  const landed = !!s.landedAt;
  const ms = (landed ? s.landedAt : Date.now()) - s.start;
  let h = `<div class="card hero hero-flight">
    <div class="hero-kicker${landed ? ' kick-land' : ''}">${landed ? 'Сел · итог не записан' : 'В воздухе'}</div>
    <div class="hero-top">
      ${a ? aircraftThumb(a, true) : ''}
      <span class="grow">
        <span class="hero-name">${esc(a ? a.name : 'Борт удалён')} <span class="mono muted">${flightNoText(s)}</span></span>
        <span class="d">${landed ? 'сел — осталось записать итог' : staleSession(s) ? 'идёт уже очень долго — забыли завершить?' : 'полёт идёт, таймер не потеряется'}</span>
      </span>
    </div>
    <div class="timer${landed ? ' landed' : ''}" id="timer" data-sid="${s.id}">${clockHtml(ms)}</div>
    ${landed
      ? `<button class="btn btn-primary" data-act="finish-flight" data-id="${s.id}">Записать итог</button>
         <button class="btn" data-nav="#/session/${s.id}">Открыть полёт</button>`
      : `<button class="btn btn-primary btn-land" data-act="land-flight" data-id="${s.id}">${ICONS.landing}Посадка</button>
         <button class="btn" data-nav="#/session/${s.id}">Открыть полёт</button>`}
  </div>`;
  const rest = armedFleet().filter((x) => !activeSessionOf(x.id));
  h += todayFleetBlock('Остальные борта', rest, String(rest.length));
  h += todayMaintBlock(true);
  return { main: h, side: todaySide(wxHeroOrRow(a, true), todayFlights(), '') };
}

// Разбор: итоги дня, «Разобраться», полёты за сегодня, «Ещё один полёт».
function todayDebrief() {
  const today = todayFlights();
  const mins = today.reduce((n, s) => n + (s.durationMin || 0), 0);
  const trouble = today.filter((s) => s.result && s.result !== 'normal');
  let h = `<div class="stat-line">
    <div class="stat"><div class="v">${today.length}</div><div class="k">${plural(today.length, 'полёт сегодня', 'полёта сегодня', 'полётов сегодня')}</div></div>
    <div class="stat"><div class="v">${fmtDur(mins)}</div><div class="k">налёт</div></div>
    <div class="stat"><div class="v${trouble.length ? ' warn' : ''}">${trouble.length}</div><div class="k">с проблемой</div></div>
  </div>`;

  // Разобраться: проблемные полёты без закрытой работы новее них,
  // разряженные АКБ, резервная копия, сборы.
  let rows = '';
  const shown = new Set(); // осмотры, уже показанные в «Разобраться»
  for (const s of trouble) {
    const a = S.aircraft.find((x) => x.id === s.aircraftId);
    if (!a) continue;
    const fixed = S.maintenance.some((m) => m.aircraftId === a.id && m.done && m.createdAt >= s.start);
    if (fixed) continue;
    // Авто-осмотр после итога уже создан (открытая работа новее полёта) —
    // кнопка ведёт в него, а не заводит второй.
    const open = S.maintenance.find((m) => m.aircraftId === a.id && !m.done && (m.createdAt || 0) >= s.start);
    if (open) shown.add(open.id);
    const btn = open
      ? `<button class="btn btn-sm" data-act="edit-maint" data-id="${open.id}">Осмотр</button>`
      : `<button class="btn btn-sm" data-act="add-maint" data-id="${a.id}" data-kind="inspection" data-title="Осмотр после полёта ${flightNoText(s)}">Осмотр</button>`;
    rows += `<div class="row"><span class="row-ic">${ICONS.tools}</span>
      <button class="grow row-main" data-act="session-info" data-id="${s.id}"><span class="grow">
        <span class="t" style="color:var(--warn)">Полёт <span class="mono">${flightNoText(s)}</span> · ${esc(a.name)}</span>
        <span class="d">${s.problems ? 'проблема: «' + esc(s.problems) + '»' : resultLabel(s, '').toLowerCase()}</span></span></button>
      ${btn}
    </div>`;
  }
  const flown = S.batteries.filter((b) => b.charge === 'flown' && b.status !== 'retired');
  if (flown.length) {
    rows += `<div class="row"><span class="row-ic">${ICONS.bolt}</span>
      <button class="grow row-main" data-nav="#/batteries"><span class="grow">
        <span class="t">${flown.length === 1 ? 'Зарядить: ' + esc(flown[0].label) : `Зарядить ${flown.length} ${plural(flown.length, 'аккумулятор', 'аккумулятора', 'аккумуляторов')}`}</span>
        <span class="d">${flown.length === 1 ? 'после полёта' : flown.map((b) => esc(b.label)).join(' · ')}</span></span></button>
      ${flown.length === 1
        ? `<button class="chip st-flown" data-act="batt-charge" data-id="${flown[0].id}">${CHARGE_LABEL.flown}</button>`
        : `<button class="btn btn-sm" data-act="batts-charged-all">Все заряжены</button>`}
    </div>`;
  }
  const since = flightsSinceBackup();
  if (since || backupDue()) {
    const days = backupAgeDays();
    rows += `<div class="row"><span class="row-ic">${ICONS.backup}</span>
      <button class="grow row-main" data-nav="#/backup"><span class="grow">
        <span class="t">Сохранить резервную копию</span>
        <span class="d wrap">${since ? `${since} ${plural(since, 'полёт', 'полёта', 'полётов')} с последней копии` : 'полётов после копии нет'}${days == null ? ' · копии ещё не было' : ` · ${days} ${plural(days, 'день', 'дня', 'дней')} назад`}</span></span></button>
      <button class="btn btn-sm" data-act="export-all">Сохранить</button>
    </div>`;
  }
  if (S.packing.length) {
    rows += rowBtn('data-nav="#/packing"', `<span class="grow"><span class="t">Проверить, что всё собрано</span>
      <span class="d wrap">Сборы: ничего не забыть на поле</span></span>`, 'packing');
  }
  if (rows) h += `<div class="h2">Разобраться</div><div class="card flat">${rows}</div>`;

  // «Полёты сегодня» живут в правой колонке; на телефоне они встают между
  // «Разобраться» и кнопкой — блоки после них помечены .late (CSS order).
  h += `<button class="btn late" data-act="start-prep">${ICONS.flight}Ещё один полёт</button>`;
  // Открытые работы, не связанные с сегодняшними полётами (старый ремонт
  // другого борта), иначе пропали бы с «Сегодня» до конца дня; те, что
  // уже в «Разобраться», не повторяем.
  h += todayMaintBlock(false, shown, true);
  return { main: h, side: todaySide(wxHeroOrRow(armedFleet()[0]), today, '') };
}

function sessionRow(s) {
  const a = S.aircraft.find((x) => x.id === s.aircraftId);
  return rowBtn(`data-act="session-info" data-id="${s.id}"`,
    `<span class="grow"><span class="t"><span class="mono">${flightNoText(s)}</span> ${esc(a ? a.name : 'Борт удалён')}</span>
     <span class="d">${fmtDate(s.date)} · ${fmtDur(s.durationMin)} · <span class="result-${esc(s.result || 'normal')}">${resultLabel(s)}</span></span></span>`);
}

/* == src/11-fleet.js == */
// RC Planner · Флот: группы, строки бортов, комплектация, установка АКБ.

// Флот — это модели и батареи: два списка одной вкладки.
function fleetSeg(active) {
  return `<div class="seg" style="margin-bottom:10px">
    <button data-nav="#/fleet" aria-pressed="${active === 'fleet'}">Борта</button>
    <button data-nav="#/batteries" aria-pressed="${active === 'batteries'}">Аккумуляторы</button>
  </div>`;
}

/* ---------- Группы флота ----------
   Группы лежат в settings.fleetGroups [{id, name, parentId|null}],
   у борта — a.groupId. Один уровень вложенности: подгруппой может
   стать только группа без своих подгрупп, родителем — только корневая.
   Перенос борта — кнопкой на строке (два касания): на тач-экране в поле
   это надёжнее перетаскивания пальцем. */
function fleetGroups() { return S.settings.fleetGroups || []; }

// Сортировка внутри групп; группы порядок не меняют и не сбрасываются.
function fleetSortCmp() {
  const mode = S.settings.fleetSort || 'name';
  const stOrder = { ready: 0, check: 1, maintenance: 2, grounded: 3, unknown: 4 };
  const tOrder = { quad: 0, plane: 1, wing: 2, other: 3 };
  return (x, y) => {
    if (mode === 'status') {
      const d = (stOrder[statusOf(x)] || 0) - (stOrder[statusOf(y)] || 0);
      if (d) return d;
    } else if (mode === 'type') {
      const d = (tOrder[x.type] != null ? tOrder[x.type] : 9) - (tOrder[y.type] != null ? tOrder[y.type] : 9);
      if (d) return d;
    }
    return (x.name || '').localeCompare(y.name || '', 'ru');
  };
}

function fleetRow(a) {
  const b = armedBattery(a);
  // Имя не ужимается: кнопке имени — не меньше 45 % строки; чип статуса
  // с короткой подписью (short), чтобы не резаться многоточием.
  return `<div class="row fleet-row" data-st="${statusOf(a)}">
    <button class="grow row-main" data-nav="#/model/${a.id}">
      ${aircraftThumb(a)}<span class="grow"><span class="t">${esc(a.name)}</span>
      <span class="d">${TYPES[a.type] || ''}${a.manufacturer ? ' · ' + esc(a.manufacturer) : ''}${b ? ' · ' + battTag(b) : ''}</span></span></button>
    ${chip(statusOf(a), a.id, true)}
    <button class="row-move" data-act="move-model" data-id="${a.id}" aria-label="Переместить в группу">${ICONS.move}</button>
  </div>`;
}

function viewFleet() {
  let h = pageHead('Флот', { act: 'add-model', actLabel: 'Добавить', help: 'fleet' }) + fleetSeg('fleet');
  if (!S.aircraft.length) {
    return h + emptyState('Пока нет ни одного борта.', 'add-model', 'Добавить борт', 'fleet');
  }
  const groups = fleetGroups();
  h += `<div class="fleet-bar">
    ${selectHtml('fleetSort', [['name', 'По названию'], ['status', 'По статусу'], ['type', 'По типу']],
      S.settings.fleetSort || 'name', 'data-change="fleet-sort" style="flex:1;min-height:var(--seg)"')}
    <button class="btn btn-sm" data-act="add-group">${ICONS.plus}Группа</button>
  </div>`;
  const cmp = fleetSortCmp();
  const inGroup = (gid) => S.aircraft.filter((a) => (a.groupId || '') === gid).sort(cmp);
  const block = (g, sub) => {
    const list = inGroup(g.id);
    return `<div class="grp-head${sub ? ' grp-sub' : ''}">
      <span class="grow">${esc(g.name)} <span class="muted small">(${list.length})</span></span>
      <button class="grp-edit" data-act="edit-group" data-id="${g.id}" aria-label="Настроить группу">${ICONS.more}</button></div>
      ${list.length
        ? `<div class="card flat${sub ? ' grp-sub' : ''}">${list.map(fleetRow).join('')}</div>`
        : `<div class="small dim grp-empty${sub ? ' grp-sub' : ''}">пока пусто — перенесите борт кнопкой на его строке</div>`}`;
  };
  const loose = inGroup('');
  if (loose.length) {
    if (groups.length) h += `<div class="grp-head"><span class="grow muted">Без группы</span></div>`;
    h += `<div class="card flat">${loose.map(fleetRow).join('')}</div>`;
  }
  for (const g of groups.filter((x) => !x.parentId)) {
    h += block(g, false);
    for (const sg of groups.filter((x) => x.parentId === g.id)) h += block(sg, true);
  }
  return h;
}

// Форма группы: имя, родитель (для «сделать подгруппой»), удаление.
function openGroupForm(g, moveAid) {
  const isNew = !g;
  g = g || {};
  const groups = fleetGroups();
  const hasSubs = groups.some((x) => x.parentId === g.id);
  const parents = groups.filter((x) => !x.parentId && x.id !== g.id);
  openModal(isNew ? 'Новая группа' : 'Группа', `<form data-form="group" ${g.id ? `data-id="${esc(g.id)}"` : ''} ${moveAid ? `data-move-aid="${esc(moveAid)}"` : ''}>
    ${field('Название', `<input type="text" name="name" required value="${esc(g.name || '')}" placeholder="напр. Резерв или Поле у реки">`)}
    ${hasSubs
      ? `<div class="hint" style="margin-bottom:10px">У группы есть подгруппы — сделать её подгруппой нельзя.</div>`
      : parents.length
        ? field('Внутри группы', selectHtml('parentId', [['', '— корневая —']].concat(parents.map((p) => [p.id, p.name])), g.parentId || ''), 'подгруппа — один уровень вложенности')
        : ''}
    <button class="btn btn-primary" type="submit">Сохранить</button>
    ${g.id ? `<button class="btn btn-danger" type="button" data-act="del-group" data-id="${g.id}">Удалить группу</button>` : ''}
  </form>`);
}

// Перенос борта: список групп в модалке — два касания вместо drag-n-drop.
function openMoveModal(a) {
  const groups = fleetGroups();
  const row = (gid, label, sub) => rowBtn(`data-act="move-model-to" data-id="${esc(a.id)}" data-gid="${esc(gid)}" ${sub ? 'style="padding-left:28px"' : ''}`,
    `<span class="grow"><span class="t">${label}</span></span>`);
  let h = '<div class="card flat">';
  h += row('', 'Без группы');
  for (const g of groups.filter((x) => !x.parentId)) {
    h += row(g.id, esc(g.name));
    for (const sg of groups.filter((x) => x.parentId === g.id)) h += row(sg.id, esc(sg.name), true);
  }
  h += rowBtn(`data-act="move-new-group" data-id="${a.id}"`, `<span class="grow"><span class="t">+ Новая группа…</span></span>`);
  h += '</div>';
  openModal(`«${esc(a.name)}» — в группу`, h);
}

/* Слоты оборудования: [ключ, подпись, опции]. Опции: types — типы бортов,
   которым слот положен (нет опций — положен всем; ПУСТОЙ список — слот
   убран, но подпись сохранена ради старых записей); hint — подсказка под
   полем «Название / модель».

   Правило показа — compSlots: слот виден, если положен типу борта ИЛИ
   в нём у ЭТОГО борта уже что-то записано. Второе условие обязательно:
   приложение опубликовано, и у чужих бортов в слоте «Передатчик» лежат
   настоящие записи — их не прячем, не переносим и не переписываем.
   Тот же приём, что у легаси-заметки АКБ в compBatteryRow.

   Типы пишем литералами, без TYPES: test/checks.js исполняет этот блок
   в песочнице и сверяет по нему ключи пресетов — блок самодостаточен. */
const COMPONENTS = [
  ['motor', 'Мотор'], ['esc', 'ESC'], ['fc', 'Полётный контроллер'],
  ['rx', 'Приёмник (RX)'], ['gps', 'GPS'], ['servo', 'Сервоприводы'],
  ['prop', 'Пропеллер'], ['vtx', 'VTX'], ['camera', 'Камера'],
  ['pitot', 'Трубка Пито', { types: ['plane', 'wing'],
    hint: 'Датчик воздушной скорости: трубка, шланги, модуль давления' }],
  ['pak', 'ПАК', { types: ['plane', 'wing'],
    hint: 'Программно-аппаратный комплекс: модуль идентификации и трекинга' }],
  ['tx', 'Передатчик (старое поле)', { types: [],
    hint: 'Слот заменён на «ПАК». Перенесите запись и очистите поля — строка исчезнет.' }],
  ['battery', 'Аккумулятор'],
];

// Слоты этого борта. a.components из копии может быть чем угодно
// (validateBackup проверяет только id): индексируем своими ключами,
// поэтому строка или массив на месте объекта даёт undefined.
function compSlots(a) {
  const comps = (a && a.components) || {};
  const filled = (k) => !!(comps[k] && (comps[k].name || comps[k].fw || comps[k].notes));
  // (o.types || []) — слот с опциями, но без списка типов, не роняет
  // карточку борта: он просто никому не положен и виден только там,
  // где уже заполнен. Наличие списка сторожит test/checks.js.
  return COMPONENTS.filter(([key, , o]) => !o || (o.types || []).includes(a && a.type) || filled(key));
}

// АКБ ставится только в ОДНУ модель: занятые другими исчезают из выбора.
function battOwner(bId) {
  // без guard'а battOwner(undefined) находил модель с незаполненным batteryId
  if (!bId) return undefined;
  return S.aircraft.find((x) => x.batteryId === bId);
}

// «Собранная» модель: установленный АКБ существует и не списан.
// Возвращает объект АКБ либо undefined — одна проверка для «Сегодня»,
// окон погоды и чек-листа.
function armedBattery(a) {
  const b = a && S.batteries.find((x) => x.id === a.batteryId);
  return b && b.status !== 'retired' ? b : undefined;
}

function armedFleet() { return S.aircraft.filter((a) => armedBattery(a)); }

// Подпись аккумулятора, светящаяся состоянием заряда: зелёная — заряжен,
// синяя — после полёта (разряжен). Один вид на бортах и в списке АКБ.
function battTag(b, text) {
  const cls = b.charge === 'ready' ? 'bt-ready' : b.charge === 'flown' ? 'bt-flown' : '';
  return `<span class="${cls}">${esc(text != null ? text : b.label)}</span>`;
}
const CHARGE_LABEL = { ready: 'заряжен', flown: 'после полёта' };

// Состояние заряда отмечено — любое из двух. Без отметки полёт не начать
// (решение владельца 2026-09-07): «после полёта» тоже годится, второй
// вылет на той же банке приложение разрешает осознанно (цикл за него
// не считается). Гард требует посмотреть на банку, а не решает за пилота.
const chargeKnown = (b) => !!(b && CHARGE_LABEL[b.charge]);

// Тап по чипу перерисовывает экран, и НА МЕСТЕ чипа появляется главная
// кнопка («Взлёт» в герое и строках борта, «Начать полёт» на чек-листе).
// В перчатках промашка «два касания подряд» вторым тапом начинала полёт —
// замер ревью: одинаково при паузах 80, 150 и 300 мс, во всех трёх местах.
// Полсекунды после отметки касание сюда не считается: и полёт не начнётся,
// и повторный тап не переведёт свежий «заряжен» в «после полёта» (это
// стоило бы цикла АКБ). Приём тот же, что «UI.prep = null до await».
const CHARGE_TAP_MS = 500;
let chargeTapAt = 0;
const chargeJustTapped = () => Date.now() - chargeTapAt < CHARGE_TAP_MS;

// Чип заряда — переключатель batt-charge: зелёный «заряжен», синий
// «после полёта», серый «заряд?» (не отмечено). Одна разметка на карточку
// борта, список АКБ, чек-лист и «Взлёт» подготовленного борта. Решение
// «списанной АКБ чипа не даём» остаётся у вызывающего (battRow).
function chargeChip(b) {
  if (!b) return '';
  const cls = b.charge === 'ready' ? 'st-ready' : b.charge === 'flown' ? 'st-flown' : 'st-unknown';
  return `<button class="chip ${cls}" data-act="batt-charge" data-id="${b.id}">${CHARGE_LABEL[b.charge] || 'заряд?'}</button>`;
}

// Подготовка действует до конца дня (МСК): недельная пометка «чек-лист
// пройден» обесценила бы сам чек-лист.
function preparedFresh(a) {
  const p = a && a.prepared;
  return p && new Date(p.at).toLocaleDateString('en-CA', { timeZone: WX_TZ }) === wxTodayISO() ? p : null;
}

// Кнопку «Взлёт» без чек-листа показываем только когда лететь реально
// можно: подготовка свежая, нет запрета/открытого обслуживания и нет
// уже идущего полёта.
function takeoffReady(a) {
  if (!preparedFresh(a) || activeSessionOf(a.id) || !armedBattery(a)) return false;
  const st = statusOf(a);
  return st !== 'grounded' && st !== 'maintenance';
}

// Снять АКБ со всех моделей, кроме exceptId. Пишет напрямую в RCDB —
// вызывающий обязан обновить S.aircraft (или сделать это через put).
async function releaseBattery(bId, exceptId) {
  for (const other of S.aircraft.filter((x) => x.batteryId === bId && x.id !== exceptId)) {
    other.batteryId = null;
    await RCDB.put('aircraft', other);
  }
}

// АКБ «заперта», пока её борт в воздухе: перестановка сломала бы и
// подсчёт циклов, и связь полёта с батареей. Возвращает имя борта-помехи.
function battLockedBy(aId, bId) {
  const flying = (x) => x && activeSessionOf(x.id) && x;
  const owner = bId && battOwner(bId);
  return (flying(S.aircraft.find((x) => x.id === aId)) || (owner && owner.id !== aId && flying(owner)) || {}).name || '';
}

// Единая установка/снятие: bId в модель aId (aId пустой — просто снять
// отовсюду). Все места (карточка модели, форма модели, форма АКБ,
// чек-лист) проходят через неё либо через releaseBattery.
// Store перечитывается ОДИН раз в конце, а не после каждой записи.
async function installBattery(aId, bId) {
  const lock = battLockedBy(aId, bId);
  if (lock) { alert(`«${lock}» сейчас в полёте — аккумулятор можно переставить после посадки.`); return; }
  if (bId) await releaseBattery(bId, aId);
  const a = aId && S.aircraft.find((x) => x.id === aId);
  if (a) { a.batteryId = bId || null; await RCDB.put('aircraft', a); }
  await refresh('aircraft');
}

/* == src/12-model.js == */
// RC Planner · Карточка борта: герой и сегменты.

/* ---------- Карточка борта: герой + сегменты ----------
   Герой — статус, АКБ-пилюля, три числа, полоска регламента и одна
   кнопка «Чек-лист и полёт». Ниже сегменты «Обзор · Компоненты ·
   Обслуживание · История» (UI.modelTab): сегмент живёт при render(true)
   и сбрасывается на «Обзор» при смене борта (UI.modelTabFor). */
const MODEL_TABS = [
  ['overview', 'Обзор'], ['components', 'Компоненты'],
  ['maint', 'Обслуживание'], ['history', 'История'],
];

function viewModel() {
  const a = S.aircraft.find((x) => x.id === UI.arg);
  if (!a) return pageHead('Борт не найден', { back: '#/fleet' });
  if (UI.modelTabFor !== a.id) { UI.modelTab = 'overview'; UI.modelTabFor = a.id; }
  const tab = MODEL_TABS.some(([id]) => id === UI.modelTab) ? UI.modelTab : 'overview';
  const flights = sessionsOf(a.id).filter((s) => s.end);

  let h = pageHead(esc(a.name), {
    back: '#/fleet', act: 'edit-model', actLabel: 'Изменить', help: 'fleet',
    sub: [TYPES[a.type], a.manufacturer ? esc(a.manufacturer) : ''].filter(Boolean).join(' · '),
  });

  if (UI.justCreated === a.id) {
    const learning = onboardingSteps().todo > 0;
    h += `<div class="banner ok">${ICONS.check}<span class="grow">Борт добавлен. Это его карточка: статус, АКБ, компоненты, обслуживание.</span>
      <button class="btn-sm btn right" data-nav="#/fleet">Во «Флот»</button>
      ${learning ? '<button class="btn-sm btn right" data-nav="#/today">К обучению</button>' : ''}</div>`;
  }

  h += modelHeroHtml(a, flights);
  h += `<div class="seg four model-tabs">` + MODEL_TABS.map(([id, label]) =>
    `<button data-act="model-tab" data-tab="${id}" aria-pressed="${tab === id}">${label}</button>`).join('') + '</div>';
  h += tab === 'components' ? modelComponentsHtml(a)
    : tab === 'maint' ? modelMaintHtml(a)
    : tab === 'history' ? modelHistoryHtml(a, flights)
    : modelOverviewHtml(a);
  return h;
}

// Герой: превью 72 px и рядом чип статуса + компактный селект
// «авто/вручную»; ниже, на всю ширину карточки, АКБ-пилюля (тот же селект
// model-batt) с чипом заряда; три плитки, полоска регламента, кнопка
// «Чек-лист и полёт». Строка АКБ вынесена из-под превью: рядом с ним
// остаётся ~270 px, и пилюля с чипом в одну строку не помещались —
// герой складывался в четыре строки, превью висело посреди столбца.
function modelHeroHtml(a, flights) {
  const st = statusOf(a);
  const bat = armedBattery(a);
  const total = flights.reduce((n, s) => n + (s.durationMin || 0), 0);
  const svc = svcState(a);
  return `<div class="card hero model-hero">
    <div class="hero-top">
      ${aircraftThumb(a, true)}
      <span class="grow hero-line">${chip(st, a.id)}
        ${pillSelect('statusManual', [['', 'авто']].concat(Object.keys(STATUS).filter((k) => k !== 'unknown')
          .map((k) => [k, 'вручную: ' + STATUS[k].label])), a.statusManual || '',
          `class="sel-sm" data-change="status-manual" data-id="${a.id}" aria-label="Статус: авто или вручную"`, true)}</span>
    </div>
    <div class="hero-line hero-batt">
      ${pillSelect('modelBatt', battOptions({ freeOnly: true, keepId: a.batteryId, emptyLabel: 'Без АКБ', addNew: true, noWeight: true }), a.batteryId || '',
        `class="sel-pill${bat ? ' sel' : ''}" data-change="model-batt" data-id="${a.id}" aria-label="Аккумулятор борта"${bat ? '' : ' data-next-arm'}`)}
      ${chargeChip(bat)}
    </div>
    ${bat ? '' : `<div class="hint">Борт с установленным АКБ считается собранным к вылету
      и попадает на «Сегодня»; вес АКБ учитывается в окнах погоды.</div>`}
    <div class="stat-line">
      <div class="stat"><div class="v">${flights.length}</div><div class="k">${plural(flights.length, 'полёт', 'полёта', 'полётов')}</div></div>
      <div class="stat"><div class="v">${fmtDurShort(total)}</div><div class="k">налёт</div></div>
      <div class="stat"><div class="v">${flights[0] ? fmtDate(flights[0].date) : '—'}</div><div class="k">последний</div></div>
    </div>
    ${svc ? svcLineHtml(a, svc) : ''}
    <button class="btn btn-primary" data-act="start-prep" data-id="${a.id}">${ICONS.templates}Чек-лист и полёт</button>
  </div>`;
}

// Регламент осмотра полоской: заполнение — доля пройденного по тому
// счётчику, что ближе к сроку; при due — цвет --maint и кнопка «Осмотр».
// Регламент — напоминание, полёты не запрещает.
function svcLineHtml(a, svc) {
  const frac = Math.max(svc.every ? svc.flights / svc.every : 0, svc.everyMin ? svc.minutes / svc.everyMin : 0);
  const pct = Math.round(Math.min(1, frac) * 100);
  return `<div class="svc-line">
      <span class="small nowrap" style="color:var(--${svc.due ? 'maint' : 'mut'})">${svc.due ? 'Пора осмотреть' : `До осмотра ${svcLeftText(svc)}`}</span>
      <span class="progress"><i style="width:${pct}%${svc.due ? ';background:var(--maint)' : ''}"></i></span>
    </div>
    <div class="svc-sub"><span class="grow">пройдено ${svcSinceText(svc)} · регламент ${svcEveryText(svc)}</span>
      ${svc.due ? `<button class="btn btn-sm" data-act="add-maint" data-id="${a.id}" data-kind="inspection" data-title="Осмотр по регламенту">Осмотр</button>` : ''}
    </div>`;
}

// Строка компонента: название и версия прошивки (c.fw), если есть.
function compRow(a, key, label, c) {
  const d = c && c.name
    ? esc(c.name) + (c.fw ? ` · <span style="color:var(--info)">${esc(c.fw)}</span>` : '')
    : '<span class="muted">не указано</span>';
  return rowBtn(`data-act="edit-comp" data-id="${a.id}" data-key="${key}"`,
    `<span class="grow"><span class="t">${label}</span><span class="d">${d}</span></span>`);
}

// «Аккумулятор» — информационная строка: показывает установленную АКБ
// (или подсказку), отдельно не редактируется — источник один.
function compBatteryRow(a) {
  const comps = a.components || {};
  const ab = armedBattery(a);
  const legacy = comps.battery && (comps.battery.name || comps.battery.notes)
    ? ` · <span class="muted">заметка: ${esc([comps.battery.name, comps.battery.notes].filter(Boolean).join(' — '))}</span>` : '';
  return `<div class="row"><span class="grow"><span class="t">Аккумулятор</span>
    <span class="d">${ab
      ? `${battTag(ab)} · ${esc(ab.chem || '')} ${ab.cells ? ab.cells + 'S' : ''}${ab.p > 1 ? ab.p + 'P' : ''}${ab.capacity ? ' · ' + ab.capacity + ' мА·ч' : ''}`
      : '<span class="muted">не установлен — ставится в карточке выше</span>'}${legacy}</span></span></div>`;
}

// Открытые работы с «Выполнено» одним касанием — после краша это
// следующий очевидный шаг.
function maintOpenRows(list) {
  return list.map((m) => `<div class="row">
    ${maintThumb(m, true)}<button class="grow" data-act="edit-maint" data-id="${m.id}" style="text-align:left;min-height:var(--seg)">
      <span class="t">${esc(m.title)}</span>
      <span class="d">${MAINT_KINDS[m.kind] || ''} · ${fmtDate(m.date)}${m.next ? ' · далее: ' + esc(m.next) : ''}</span></button>
    <button class="btn btn-sm" data-act="maint-done" data-id="${m.id}">Выполнено</button>
  </div>`).join('');
}

function maintOf(a) {
  return S.maintenance.filter((m) => m.aircraftId === a.id)
    .sort((x, y) => (y.date || '').localeCompare(x.date || ''));
}

// Обзор: паспорт, заполненные компоненты, открытые работы, конфигурации,
// заметки, внизу «Экспорт борта» / «Удалить».
function modelOverviewHtml(a) {
  const bat = armedBattery(a);
  const svc = svcState(a);
  let h = '';

  // Паспорт — сетка 2 колонки. Числа нормализованы в loadAll (число или
  // null), но в разметку всё равно идут через esc() — привычка дешевле.
  const kv = [];
  if (a.weight) {
    kv.push(['Вес сухой' + (bat && bat.weight ? ' / взлётный' : ''),
      `${esc(a.weight)} г` + (bat && bat.weight ? ` / ${esc(a.weight + bat.weight)} г` : '')]);
  }
  if (a.wingspan) kv.push(['Размах', `${esc(a.wingspan)} мм`]);
  const own = wxOwnWind(a);
  kv.push(['Ветер · высота', `${own ? 'до&nbsp;' + own : '≈' + wxEstimate(a, bat && bat.weight)}&nbsp;м/с · до&nbsp;${wxOwnAlt(a)}&nbsp;м`]);
  if (svc) kv.push(['Регламент', svcEveryText(svc)]);
  if (alarmMs(a)) kv.push(['Сигнал таймера', fmtClock(alarmMs(a))]);
  h += `<div class="card"><div class="kv">${kv.map(([k, v]) =>
    `<div><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div></div>`;

  // Заполненные компоненты (с версией прошивки); пустые — за «Добавить»
  const comps = a.components || {};
  const filled = compSlots(a).filter(([key]) => key !== 'battery' && comps[key] && comps[key].name);
  h += `<div class="h2">Компоненты${filled.length ? ` <span class="cnt">${filled.length}</span>` : ''}</div><div class="card flat">`;
  h += filled.map(([key, label]) => compRow(a, key, label, comps[key])).join('');
  h += rowBtn('data-act="model-tab" data-tab="components"',
    `<span class="grow"><span class="t muted">${filled.length ? 'Все компоненты' : 'Добавить компонент'}</span></span>`, 'plus');
  h += '</div>';

  // Открытые работы
  const openM = maintOf(a).filter((m) => !m.done);
  if (openM.length) {
    h += `<div class="h2">Обслуживание <span class="cnt">${openM.length}</span></div><div class="card flat">${maintOpenRows(openM)}</div>`;
  }

  // Конфигурации
  const cfgs = S.configs.filter((c) => c.aircraftId === a.id).sort((x, y) => y.createdAt - x.createdAt);
  const groups = {};
  cfgs.forEach((c) => { (groups[c.group] = groups[c.group] || []).push(c); });
  h += '<div class="h2">Конфигурации и прошивки</div>';
  if (cfgs.length) {
    h += '<div class="card flat">';
    h += Object.keys(groups).map((g) => {
      const list = groups[g];
      return rowBtn(`data-act="config-group" data-id="${a.id}" data-group="${esc(g)}"`,
        `<span class="grow"><span class="t">${esc(g)}</span>
         <span class="d">${list.length} ${plural(list.length, 'версия', 'версии', 'версий')} · ${fmtDate(list[0].date)}</span></span>`);
    }).join('');
    h += '</div>';
  }
  h += `<button class="btn" data-act="add-config" data-id="${a.id}">Сохранить конфигурацию</button>`;

  // Заметки
  if (a.notes) h += `<div class="h2">Заметки</div><div class="card" style="white-space:pre-wrap">${esc(a.notes)}</div>`;

  h += `<hr class="sep">
    <div class="btn-line">
      <button class="btn" data-act="clone-model" data-id="${a.id}">Копия борта</button>
      <button class="btn" data-act="export-model" data-id="${a.id}">Экспорт борта</button>
    </div>
    <div class="btn-line">
      <button class="btn btn-danger" data-act="del-model" data-id="${a.id}">Удалить</button>
    </div>`;
  return h;
}

// Компоненты: строки по типу борта, АКБ — информационная.
function modelComponentsHtml(a) {
  const comps = a.components || {};
  return '<div class="card flat">' + compSlots(a).map(([key, label]) =>
    key === 'battery' ? compBatteryRow(a) : compRow(a, key, label, comps[key])).join('') +
    '</div><p class="small muted" style="margin-top:8px">Состав зависит от типа борта: у самолёта и крыла есть «Трубка Пито» и «ПАК». У компонента есть поле «Версия прошивки» — она видна в «Обзоре».</p>';
}

// Обслуживание: открытые работы, «Добавить запись», история закрытых.
function modelMaintHtml(a) {
  const maint = maintOf(a);
  const openM = maint.filter((m) => !m.done);
  const doneM = maint.filter((m) => m.done);
  let h = '<div class="card flat">';
  h += openM.length ? maintOpenRows(openM)
    : '<div class="row"><span class="grow muted small">Открытых работ нет</span></div>';
  h += '</div>';
  h += `<button class="btn" data-act="add-maint" data-id="${a.id}">Добавить запись обслуживания</button>`;
  if (doneM.length) {
    h += `<div class="h2">История <span class="cnt">${doneM.length}</span></div><div class="card flat">`;
    h += doneM.map((m) => rowBtn(`data-act="edit-maint" data-id="${m.id}"`,
      `${maintThumb(m)}<span class="grow"><span class="t" style="color:var(--mut)">${esc(m.title)}</span>
       <span class="d">${MAINT_KINDS[m.kind] || ''} · ${fmtDate(m.date)}</span></span>`)).join('');
    h += '</div>';
  }
  return h;
}

// История: все полёты борта по дням, кнопка «Весь журнал».
function modelHistoryHtml(a, flights) {
  if (!flights.length) {
    return `<div class="empty">${ICONS.flight}<p>Полётов у этого борта ещё не было.</p>
      <button class="btn btn-sm" data-act="start-prep" data-id="${a.id}">Чек-лист и полёт</button></div>`;
  }
  return logGroupedHtml(flights) + `<button class="btn" data-nav="#/journal">Весь журнал</button>`;
}
