# Выкладка на GitHub Pages: сборка public/ (та же папка, что у GitVerse
# Pages) повторяется здесь — так на сайт попадают и картинки из
# assets/art, закоммиченные без пересборки. Перед выкладкой — проверки
# данных и картинок (npm ci ставит sharp; браузеры Playwright не качаются).
# Включить один раз: Settings → Pages → Source: GitHub Actions.
# Для ветки, отличной от main: Settings → Environments → github-pages →
# Deployment branches — добавить правило для этой ветки.
name: Pages

on:
  push:
    branches: [main, 'velrafpv/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Проверки ДО выкладки: сборка сама падает на небезопасном SVG,
      # test:data сверяет CSP-хэши и инварианты данных, test:art — размеры
      # и форматы картинок (нужен sharp из devDependencies).
      - run: npm ci --no-audit --no-fund
      - run: node build.js
      - run: node test/checks.js
      - run: node test/art.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
