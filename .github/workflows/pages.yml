# Выкладка на GitHub Pages: сборка public/ (та же папка, что у GitVerse
# Pages) повторяется здесь — так на сайт попадают и картинки из
# assets/art, закоммиченные без пересборки. build.js зависимостей
# не требует: npm install не нужен.
# Включить один раз: Settings → Pages → Source: GitHub Actions.
# Для ветки, отличной от main: Settings → Environments → github-pages →
# Deployment branches — добавить правило для этой ветки.
name: Pages

on:
  push:
    branches: [main, 'velrafpv/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
