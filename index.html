<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Внешним хостам (тайлы, погода, геокодер) уходит только домен
       приложения, не путь страницы. -->
  <meta name="referrer" content="origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://api.open-meteo.com https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src https://embed.windy.com">
  <meta name="theme-color" content="#14181e">
  <meta name="build" content="__VERSION__">
  <meta name="description" content="RC Planner — локальный офлайн-помощник авиамоделиста и FPV-пилота. Данные хранятся на вашем устройстве.">
  <title>RC Planner</title>
  <script>
    // Тема и режим «В перчатках» до первой отрисовки, чтобы не мигало.
    // Тот же расчёт живёт в app.js как applyTheme(): без сохранённого
    // выбора тема берётся у системы.
    try {
      var t = localStorage.getItem('rcp.theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
      if (localStorage.getItem('rcp.gloves') === '1') document.documentElement.dataset.gloves = '';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <!-- build:pwa -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!-- /build:pwa -->
  <!-- build:css -->
  <link rel="stylesheet" href="styles.css">
  <!-- /build:css -->
</head>

</html>
