      <path d="M203.5 452.1L200.9 461.7"/>
      <path d="M178.3 443.5L174.5 452.8"/>
      <path d="M159 424L149.5 440.5"/>
      <path d="M132.4 417.1L126.3 425"/>
      <path d="M112.5 399.5L105.4 406.6"/>
