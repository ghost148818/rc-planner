    <!-- дорожка и неоновая дуга кольца (72 %), ореол — размытая копия -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#3fd6f0" stroke-opacity=".12" stroke-width="20"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round"
            stroke-dasharray="760 2000" transform="rotate(-90 256 256)" filter="url(#glow)" opacity=".8"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round"
            stroke-dasharray="760 2000" transform="rotate(-90 256 256)"/>
    <!-- дротик в наборе высоты -->
    <g transform="rotate(45 256 256)">
      <path d="M256 118 L282 214 L372 290 L372 316 L280 286 L274 352 L304 376 L304 394 L256 382 L208 394 L208 376 L238 352 L232 286 L140 316 L140 290 L230 214 Z" fill="url(#jet)" filter="url(#glow)" opacity=".55"/>
