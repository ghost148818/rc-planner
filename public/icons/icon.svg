<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- RC Planner 3.0 «Кокпит»: HUD-кольцо полёта со шкалой и дротик в наборе
       высоты. #bg — фон (make-icons.js снимает скругление для maskable и
       apple-touch), #fg — рисунок (для maskable сжимается в безопасную зону). -->
  <defs>
    <radialGradient id="bgg" cx=".3" cy=".2" r="1.1">
      <stop offset="0" stop-color="#17222f"/>
      <stop offset=".6" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#3fd6f0"/>
    </linearGradient>
    <linearGradient id="jet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3fd6f0"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect id="bg" width="512" height="512" rx="114" fill="url(#bgg)"/>
  <g id="fg">
    <!-- шкала: 48 делений, каждое четвёртое длиннее -->
